<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101218"><title>Pocket Companion — Offline</title><style>html{background:#101218;color:#f5f7fb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{max-width:520px;background:#181b24;border:1px solid #303645;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0008}.mark{width:56px;height:56px;border-radius:50%;border:5px solid #f5f7fb;position:relative;margin-bottom:20px}.mark:before{content:"";position:absolute;left:-5px;right:-5px;top:21px;border-top:5px solid #f5f7fb}.mark:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#101218;border:5px solid #f5f7fb;left:16px;top:12px}h1{font-size:1.7rem;margin:.2rem 0 .7rem}p{color:#b9c0cf;line-height:1.55}button{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:1rem;cursor:pointer}</style></head><body><main class="card"><div class="mark" aria-hidden="true"></div><h1>You’re offline</h1><p>Pocket Companion can reopen its installed app shell offline. Features that need live Supabase or CDN data will reconnect when your internet connection returns.</p><button onclick="location.reload()">Try again</button></main></body></html>
