name: PocketNexus Tournament Event Click QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tournament-event-click-qa.yml"
      - "js/features/tournament-leaderboards-v8.31.js"
      - "js/services/tournament-service.js"
      - "index.html"

permissions:
  contents: read

jobs:
  tournament-event-click-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 8123 >/tmp/pn-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Run Tournament event-click QA
        run: |
          cat > tournament-click-qa.js <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1400);
            const guest=page.getByRole('button',{name:/continue as guest/i});
            if(await guest.count())try{await guest.click({timeout:2500});await page.waitForTimeout(500)}catch{}
            await page.evaluate(()=>{
              document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop,#ppcWhatsNewBackdrop').forEach(x=>x.remove());
              window.goPage?.('tournaments');
            });
            await page.waitForTimeout(4000);
            await page.evaluate(()=>document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop,#ppcWhatsNewBackdrop').forEach(x=>x.remove()));

            const before=await page.evaluate(()=>({
              selected:String(state?.tournamentPrefs?.selectedKey||''),
              cards:document.querySelectorAll('.tournamentEventCard').length,
              body:document.body.innerText,
              error:document.querySelector('.runtimeError .dangerBox')?.innerText||''
            }));
            const allEvents=page.getByRole('button',{name:/all events/i});
            if(await allEvents.count()){await allEvents.click();await page.waitForTimeout(600)}
            const cards=page.locator('.tournamentEventCard');
            const count=await cards.count();
            if(count<2){console.error('TOURNAMENT_CLICK_QA_NO_CARDS',JSON.stringify({before,count,errors},null,2));process.exit(1)}
            const target=cards.nth(1);
            const targetText=(await target.innerText()).trim();
            await target.click({timeout:5000});
            await page.waitForTimeout(1800);
            const after=await page.evaluate(()=>({
              selected:String(state?.tournamentPrefs?.selectedKey||''),
              view:String(state?.tournamentPrefs?.view||''),
              header:document.querySelector('.tournamentEventIdentity h2')?.textContent?.trim()||'',
              cards:document.querySelectorAll('.tournamentEventCard').length,
              runtimeError:document.querySelector('.runtimeError .dangerBox')?.innerText||'',
              displayError:/We hit a display error/i.test(document.body.innerText)
            }));
            console.log('TOURNAMENT_CLICK_QA_RESULT',JSON.stringify({before:{selected:before.selected,cards:before.cards,error:before.error},targetText,after,errors},null,2));
            await browser.close();
            if(!after.selected||after.selected===before.selected||after.view!=='leaderboard'||!after.header||after.runtimeError||after.displayError||errors.length)process.exit(1);
            console.log('TOURNAMENT_CLICK_QA_OK');
          })();
          NODE
          node tournament-click-qa.js

# Gate #5 current-head baseline trigger
