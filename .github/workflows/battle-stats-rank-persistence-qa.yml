name: PocketNexus Battle Stats Rank Persistence QA

on:
  push:
    branches: [main]
    paths:
      - "js/app/battle_gym.js"
      - "js/app/performance.js"
      - "js/services/rank-session-service.js"
      - "js/services/storage-service.js"
      - "js/core/**"
      - "index.html"
      - ".github/workflows/battle-stats-rank-persistence-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battle-stats-rank-persistence-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start isolated site
        run: |
          python3 -m http.server 8123 >/tmp/pn-battle-persistence.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Verify Battle to Statistics persistence and Master Ball service contract
        run: |
          cat > battle-stats-rank-persistence-qa.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},serviceWorkers:'block'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>typeof window.goPage==='function'&&typeof window.save==='function',{timeout:20000});
            const guest=page.getByRole('button',{name:/continue as guest/i});
            if(await guest.count())await guest.click({timeout:3000}).catch(()=>{});
            await page.evaluate(()=>{
              state.onboarding={...(state.onboarding||{}),completed:true,skipped:true};
              state.matches=[];
              state.rankHistory=[];
              state.sessions=[];
              state.decks=[{id:'qa-deck',name:'QA Persistence Deck',archetype:'QA Persistence Deck',cards:[],createdAt:Date.now(),updatedAt:Date.now()}];
              save();
              document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop,#ppcWhatsNewBackdrop,.mobileMoreBackdrop').forEach(x=>x.remove());
            });

            await page.evaluate(()=>window.goPage('matches'));
            await page.waitForTimeout(800);
            const formText=(await page.locator('#app').innerText()).slice(0,2500);
            assert(/Quick Record/i.test(formText),'Battle Quick Record form did not render');

            const selectInfo=await page.locator('#app select').evaluateAll(xs=>xs.map((s,index)=>({index,id:s.id||'',options:[...s.options].map(o=>o.textContent.trim())})));
            console.log('BATTLE_SELECTS',JSON.stringify(selectInfo,null,2));
            const deckMeta=selectInfo.find(x=>x.options.some(o=>/QA Persistence Deck/i.test(o)));
            assert(deckMeta,`Seeded QA deck select not found: ${JSON.stringify(selectInfo)}`);
            const deckSelect=page.locator('#app select').nth(deckMeta.index);
            const deckIndex=deckMeta.options.findIndex(x=>/QA Persistence Deck/i.test(x));
            await deckSelect.selectOption({index:deckIndex});

            const matchMeta=selectInfo.find(x=>x.options.some(o=>/Ranked/i.test(o))&&x.index!==deckMeta.index);
            assert(matchMeta,`Ranked match select not found: ${JSON.stringify(selectInfo)}`);
            const matchType=page.locator('#app select').nth(matchMeta.index);
            const rankedIndex=matchMeta.options.findIndex(x=>/Ranked/i.test(x));
            await matchType.selectOption({index:rankedIndex});

            const opponentMeta=selectInfo.find(x=>x.index!==deckMeta.index&&x.index!==matchMeta.index&&x.options.some(o=>/opponent|archetype/i.test(o))) || selectInfo.find(x=>x.index!==deckMeta.index&&x.index!==matchMeta.index&&x.options.length>3);
            assert(opponentMeta,`Opponent archetype select not found: ${JSON.stringify(selectInfo)}`);
            const opponent=page.locator('#app select').nth(opponentMeta.index);
            const oppIndex=opponentMeta.options.findIndex((x,i)=>i>0&&String(x).trim()&&!/select|choose/i.test(x));
            assert(oppIndex>0,`No opponent archetype option available: ${JSON.stringify(opponentMeta.options.slice(0,8))}`);
            await opponent.selectOption({index:oppIndex});

            const second=page.getByRole('button',{name:/Went Second/i}).first();
            if(await second.count())await second.click();
            const win=page.getByRole('button',{name:/WIN/i}).first();
            assert(await win.count(),'WIN record button missing');
            await win.click();
            await page.waitForTimeout(800);

            const recorded=await page.evaluate(()=>{
              const m=(state.matches||[]).slice(-1)[0]||null;
              return {count:(state.matches||[]).length,match:m,page:state.page};
            });
            console.log('BATTLE_RECORDED_STATE',JSON.stringify(recorded,null,2));
            assert(recorded.count===1,`Expected exactly one recorded match, got ${recorded.count}`);
            assert(recorded.match?.result==='win',`Recorded result is not win: ${JSON.stringify(recorded.match)}`);
            assert(/rank/i.test(String(recorded.match?.gameMode||recorded.match?.matchType||'')),`Recorded match is not ranked: ${JSON.stringify(recorded.match)}`);

            await page.evaluate(()=>{state.page='stats';render()});
            await page.waitForTimeout(500);
            const statsText=await page.locator('#app').innerText();
            console.log('STATS_AFTER_RECORD',statsText.slice(0,1800));
            assert(/Record[\s\S]{0,80}1-0/i.test(statsText),'Statistics did not show 1-0 record after battle');
            assert(/100(?:\.0)?%/.test(statsText),'Statistics did not show 100% win rate after battle');

            await page.reload({waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>typeof window.goPage==='function',{timeout:20000});
            await page.waitForTimeout(600);
            const persisted=await page.evaluate(()=>({count:(state.matches||[]).length,last:(state.matches||[]).slice(-1)[0]||null}));
            console.log('BATTLE_PERSISTED_STATE',JSON.stringify(persisted,null,2));
            assert(persisted.count===1&&persisted.last?.result==='win','Recorded battle did not survive reload');
            await page.evaluate(()=>{state.page='stats';render()});
            await page.waitForTimeout(400);
            const persistedStats=await page.locator('#app').innerText();
            assert(/Record[\s\S]{0,80}1-0/i.test(persistedStats),'Statistics lost recorded result after reload');

            const masterBall=await page.evaluate(async()=>{
              const calls=[];
              const old=window.getPPCCloudClient;
              window.getPPCCloudClient=()=>({rpc:async(name,args)=>{
                calls.push({name,args});
                if(name==='start_master_ball_session')return {data:{ok:true,status:'session-active',session:{id:'qa-session',current_rp:1000,current_win_streak:0,best_win_streak:0,wins:0,losses:0,ties:0,streak_bonus_rp:0}},error:null};
                if(name==='record_master_ball_match')return {data:{ok:true,sessionId:'qa-session',currentRP:1010,currentStreak:1,bestStreak:1,wins:1,losses:0,ties:0,totalStreakBonusRP:0,totalRPGained:10},error:null};
                return {data:null,error:{message:`Unexpected RPC ${name}`}};
              }});
              try{
                const start=await window.PPCRankSessionService.start(1000);
                const result=await window.PPCRankSessionService.recordMatch('qa-session','qa-match-1','win');
                return {calls,start,result,data:window.PPCRankSessionService.getData()};
              } finally {window.getPPCCloudClient=old;}
            });
            console.log('MASTER_BALL_SERVICE_CONTRACT',JSON.stringify(masterBall,null,2));
            assert(masterBall.calls[0]?.name==='start_master_ball_session','Master Ball start RPC was not called');
            assert(masterBall.calls[0]?.args?.p_starting_rp===1000,'Master Ball starting RP argument changed');
            assert(masterBall.calls[1]?.name==='record_master_ball_match','Master Ball match RPC was not called');
            assert(masterBall.calls[1]?.args?.p_match_id==='qa-match-1'&&masterBall.calls[1]?.args?.p_result==='win','Master Ball match RPC arguments changed');
            assert(masterBall.data?.session?.current_rp===1010&&masterBall.data?.session?.wins===1&&masterBall.data?.session?.current_win_streak===1,'Master Ball browser session state did not consume RPC result');

            assert(!errors.some(x=>/is not defined|TypeError|ReferenceError/i.test(x)),`Runtime errors: ${errors.join(' | ')}`);
            await browser.close();
            console.log('BATTLE_STATS_RANK_PERSISTENCE_QA_OK');
          })().catch(e=>{console.error('BATTLE_STATS_RANK_PERSISTENCE_QA_FAILURE',e);process.exit(1)});
          NODE
          node battle-stats-rank-persistence-qa.cjs
