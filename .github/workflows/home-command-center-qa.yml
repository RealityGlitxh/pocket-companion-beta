name: PocketNexus Home Command Center QA

on:
  workflow_dispatch:
  push:
    branches: [main, home-dashboard-final-polish-v8.75.0]
    paths:
      - ".github/workflows/home-command-center-qa.yml"
      - "index.html"
      - "css/home-command-center-v8.75.0.css"
      - "js/features/home-command-center-v8.75.0.js"
      - "js/app/home.js"
      - "js/services/meta-service.js"
      - "qa/home-command-center-qa.cjs"
  pull_request:
    paths:
      - ".github/workflows/home-command-center-qa.yml"
      - "index.html"
      - "css/home-command-center-v8.75.0.css"
      - "js/features/home-command-center-v8.75.0.js"
      - "js/app/home.js"
      - "js/services/meta-service.js"
      - "qa/home-command-center-qa.cjs"

permissions:
  contents: read

jobs:
  home-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start isolated local beta
        run: |
          python3 -m http.server 8123 >/tmp/pn-home-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Run Home command center QA
        run: node qa/home-command-center-qa.cjs
