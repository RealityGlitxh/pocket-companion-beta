name: PocketNexus Streamer OBS 2.0 QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/streamer-obs2-qa.yml"
      - "js/**"
      - "css/**"
      - "styles/**"
      - "index.html"
      - "overlay*.html"

permissions:
  contents: read

jobs:
  obs2-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 8123 >/tmp/pn-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Run OBS 2.0 QA
        run: |
          cat > obs2-qa.js <<'NODE'
          const {chromium}=require('playwright');
          const vps=[['desktop',1440,900],['tablet',820,1180],['mobile',390,844]];
          const modes=['ranked','tournament','caster'];
          (async()=>{
            const browser=await chromium.launch({headless:true});const failures=[];
            for(const [vp,w,h] of vps){
              const ctx=await browser.newContext({viewport:{width:w,height:h},serviceWorkers:'block'});const page=await ctx.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e.message||e)));
              await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded'});await page.waitForTimeout(1200);
              const guest=page.getByRole('button',{name:/continue as guest/i});if(await guest.count())try{await guest.click({timeout:2000})}catch{}
              await page.evaluate(()=>{document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop,#ppcWhatsNewBackdrop,[role="dialog"]').forEach(x=>x.remove());window.goPage?.('streamer')});await page.waitForTimeout(1500);
              const sources=[];
              for(const mode of modes){
                await page.evaluate(m=>window.streamerMode?.(m),mode);await page.waitForTimeout(500);
                const s=await page.evaluate(mode=>{const studio=document.querySelector(`.pnObsStudio[data-mode="${mode}"]`),frame=studio?.querySelector('iframe');return {obs2:!!window.PPCStreamerOBS2,studio:!!studio,frame:!!frame,src:frame?.getAttribute('src')||'',legacy:[...document.querySelectorAll('#streamPreview')].every(x=>getComputedStyle(x).display==='none'||x.hidden),overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth,error:/This page hit an error/i.test(document.body.innerText),stored:!!state.streamer?.overlays?.[mode]}} ,mode);
                if(!s.obs2||!s.studio||!s.frame||!s.src.includes('overlay.html?overlay=')||/[?&]mode=/i.test(s.src)||!s.legacy||s.overflow>8||s.error||!s.stored)failures.push({vp,mode,s});
                const source=await page.evaluate(m=>PPCStreamerOBS2.sourceUrl(m),mode);sources.push(source);
                if(!source.includes('overlay.html?overlay=')||/[?&]mode=/i.test(source)||/write_token|access_token|authorization|apikey=/i.test(source))failures.push({vp,mode,type:'source',source});
                await page.evaluate(m=>PPCStreamerOBS2.set('theme','blue',m),mode);const persisted=await page.evaluate(m=>state.streamer.overlays[m].theme,mode);if(persisted!=='blue')failures.push({vp,mode,type:'persistence'});
              }
              if(new Set(sources).size!==1)failures.push({vp,type:'unified-source',sources});
              if(errors.length)failures.push({vp,type:'pageerrors',errors});await ctx.close();
            }
            const p=await browser.newPage();const r=await p.goto('http://127.0.0.1:8123/overlay.html',{waitUntil:'domcontentloaded'});if(!r||r.status()!==200)failures.push({file:'overlay.html',type:'overlay-http',status:r?.status()});await p.close();
            await browser.close();console.log('OBS2_QA_RESULTS',JSON.stringify(failures,null,2));if(failures.length){console.error('OBS2_QA_FAILURES',failures.length);process.exit(1)}console.log('OBS2_QA_OK');
          })();
          NODE
          node obs2-qa.js
