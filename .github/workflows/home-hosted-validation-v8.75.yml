name: PocketNexus Home Hosted Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/home-hosted-validation-v8.75.yml"
      - "index.html"
      - "css/home-command-center-v8.75.0.css"
      - "js/features/home-command-center-v8.75.0.js"

permissions:
  contents: read

jobs:
  hosted-home:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Validate live Home command center
        env:
          BETA_URL: https://beta.pocketnexus.app/
        run: |
          cat > hosted-home-qa.cjs <<'NODE'
          const { chromium, request } = require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const base=process.env.BETA_URL;
          const expectedRuntime='8.75.0';
          const expectedCss='8.75.2';
          const fatal=[];
          (async()=>{
            const api=await request.newContext({extraHTTPHeaders:{'cache-control':'no-cache','pragma':'no-cache'}});
            const indexRes=await api.get(`${base}?home875=${Date.now()}`);
            assert(indexRes.ok(),`Home HTTP ${indexRes.status()}`);
            const html=await indexRes.text();
            assert(html.includes('css/home-command-center-v8.75.0.css?v=875000'),'live index missing Home v8.75 CSS');
            assert(html.includes('js/features/home-command-center-v8.75.0.js?v=875000'),'live index missing Home v8.75 JS');
            const cssRes=await api.get(`${base}css/home-command-center-v8.75.0.css?verify=${Date.now()}`);
            assert(cssRes.ok(),`Home CSS HTTP ${cssRes.status()}`);
            assert((await cssRes.text()).includes(expectedCss),`Home CSS is not v${expectedCss}`);
            const jsRes=await api.get(`${base}js/features/home-command-center-v8.75.0.js?verify=${Date.now()}`);
            assert(jsRes.ok(),`Home JS HTTP ${jsRes.status()}`);
            assert((await jsRes.text()).includes(expectedRuntime),`Home JS is not v${expectedRuntime}`);
            await api.dispose();

            for(const viewport of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]){
              const browser=await chromium.launch({headless:true});
              const context=await browser.newContext({viewport:{width:viewport.width,height:viewport.height},serviceWorkers:'block'});
              const page=await context.newPage();
              page.on('pageerror',e=>fatal.push(`${viewport.name} pageerror: ${e.message}`));
              page.on('console',m=>{if(m.type()==='error'&&!/favicon|Failed to load resource|ERR_FAILED|net::ERR_/i.test(m.text()))fatal.push(`${viewport.name} console: ${m.text()}`)});
              await page.goto(`${base}?home875=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
              const guest=page.locator('[data-entry-action="guest"]');if(await guest.count())await guest.click().catch(()=>{});
              await page.waitForFunction(()=>typeof goPage==='function'&&typeof dashboard==='function',{timeout:60000});
              await page.evaluate(()=>{try{window.PPCWhatsNew?.close?.(true)}catch{};document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop,#ppcWhatsNewBackdrop,.mobileMoreBackdrop').forEach(x=>x.remove());goPage('dashboard')});
              await page.waitForFunction(()=>document.querySelector('.pnHomeCommandCenter')?.dataset.homeVersion==='8.75.0',{timeout:30000});
              const result=await page.evaluate(()=>({version:document.querySelector('.pnHomeCommandCenter')?.dataset.homeVersion||'',hero:document.querySelector('.pnHomeHero h1')?.textContent?.trim()||'',meta:!!document.querySelector('.pnHomeMeta'),quick:document.querySelectorAll('.pnHomeQuickGrid button').length,overflow:Math.max(0,Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth)}));
              assert(result.version===expectedRuntime,`${viewport.name} wrong Home version ${result.version}`);
              assert(result.hero==='Competitive Command Center',`${viewport.name} command-center hero missing`);
              assert(result.meta,`${viewport.name} Meta Read missing`);
              assert(result.quick>=4&&result.quick<=6,`${viewport.name} quick actions density ${result.quick}`);
              assert(result.overflow<=4,`${viewport.name} horizontal overflow ${result.overflow}px`);
              await browser.close();
            }
            assert(fatal.length===0,`hosted Home runtime errors: ${fatal.join(' | ')}`);
            console.log('HOME_HOSTED_VALIDATION_OK',JSON.stringify({runtime:expectedRuntime,css:expectedCss,desktop:true,mobile:true}));
          })().catch(e=>{console.error('HOME_HOSTED_VALIDATION_FAILURE',e);process.exit(1)});
          NODE
          node hosted-home-qa.cjs
