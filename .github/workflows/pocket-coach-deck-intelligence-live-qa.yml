name: Pocket Coach Deck Intelligence Live QA

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/pocket-coach/index.ts'
      - 'supabase/functions/pocket-coach/deck-audit.js'
      - '.github/workflows/pocket-coach-deck-intelligence-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-deck-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      POCKETNEXUS_QA_EMAIL: ${{ secrets.POCKETNEXUS_QA_EMAIL }}
      POCKETNEXUS_QA_PASSWORD: ${{ secrets.POCKETNEXUS_QA_PASSWORD }}
      SUPABASE_URL: https://cdmzrsvwztndqfwzsumo.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_rRpqFtZ_izENE8u8gTjo9Q_858RVJzl
    steps:
      - name: Verify QA credentials are configured
        run: |
          if [ -z "$POCKETNEXUS_QA_EMAIL" ] || [ -z "$POCKETNEXUS_QA_PASSWORD" ]; then
            echo "::error::Missing PocketNexus QA credentials"
            exit 1
          fi
      - name: Create authenticated QA session
        run: |
          payload=$(jq -nc --arg email "$POCKETNEXUS_QA_EMAIL" --arg password "$POCKETNEXUS_QA_PASSWORD" '{email:$email,password:$password}')
          code=$(curl -sS -o /tmp/auth.json -w "%{http_code}" \
            -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            --data "$payload")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::QA authentication failed ($code)"
            cat /tmp/auth.json
            exit 1
          fi
          token=$(jq -r '.access_token // empty' /tmp/auth.json)
          if [ -z "$token" ]; then
            echo "::error::No access token returned"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "QA_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Verify Edge Function preflight transport
        run: |
          code=$(curl -sS -o /tmp/preflight.txt -w "%{http_code}" \
            -X OPTIONS "$SUPABASE_URL/functions/v1/pocket-coach" \
            -H "Origin: https://beta.pocketnexus.app" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,apikey,content-type")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Pocket Coach preflight failed ($code)"
            cat /tmp/preflight.txt
            exit 1
          fi
      - name: Verify live Pocket Coach status transport
        run: |
          code=$(curl -sS -o /tmp/status.json -w "%{http_code}" \
            -X POST "$SUPABASE_URL/functions/v1/pocket-coach" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $QA_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"action":"status"}')
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Pocket Coach status failed ($code)"
            cat /tmp/status.json
            exit 1
          fi
          jq -e '.deckIntelligenceAudit == true' /tmp/status.json >/dev/null || { echo "::error::deckIntelligenceAudit is not live"; cat /tmp/status.json; exit 1; }
          jq -e '.knowledgeEngine == "v4"' /tmp/status.json >/dev/null || { echo "::error::knowledgeEngine v4 is not live"; cat /tmp/status.json; exit 1; }
          jq -e '.verifiedCardGameplay == true' /tmp/status.json >/dev/null || { echo "::error::Verified card grounding regressed"; cat /tmp/status.json; exit 1; }
      - name: Verify live Pocket Coach send path
        run: |
          payload=$(jq -nc --arg message "Build me a deck around Team Rocket's Articuno ex" '{message:$message}')
          code=$(curl -sS --max-time 90 -o /tmp/send.json -w "%{http_code}" \
            -X POST "$SUPABASE_URL/functions/v1/pocket-coach" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $QA_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Pocket Coach send failed ($code)"
            cat /tmp/send.json
            exit 1
          fi
          jq -e '.answer | type == "string" and length > 0' /tmp/send.json >/dev/null || { echo "::error::Pocket Coach send returned no answer"; cat /tmp/send.json; exit 1; }
          jq -e '.conversationId | type == "string" and length > 0' /tmp/send.json >/dev/null || { echo "::error::Pocket Coach send returned no conversationId"; cat /tmp/send.json; exit 1; }
          echo "POCKET_COACH_LIVE_TRANSPORT_SEND_QA_OK"
