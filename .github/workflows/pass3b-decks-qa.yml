name: PocketNexus Pass 3B-2 Decks QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pass3b-decks-qa.yml"

jobs:
  decks-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Static checks
        run: |
          node --check js/features/decks-refine-v8.65.2.js
          grep -q "pass3b-decks-v8.65.2.css?v=865201" index.html
          grep -q "decks-refine-v8.65.2.js?v=865201" index.html
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8123 >/tmp/pn-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Validate Decks
        run: |
          cat > decks-qa.js <<'NODE'
          const { chromium }=require('playwright');
          const viewports=[['desktop',1440,900],['tablet',820,1180],['mobile',390,844]];
          (async()=>{const browser=await chromium.launch({headless:true});let failures=0;
            for(const [name,width,height] of viewports){const context=await browser.newContext({viewport:{width,height},serviceWorkers:'block'});const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e.message||e)));
              await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded',timeout:30000});await page.waitForTimeout(1400);
              const guest=page.getByRole('button',{name:/continue as guest/i});if(await guest.count())try{await guest.click({timeout:2500});await page.waitForTimeout(650)}catch{}
              await page.evaluate(()=>{try{window.onboardingSkip?.()}catch{};document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop').forEach(x=>x.remove())});
              await page.evaluate(()=>window.goPage?.('decks'));await page.waitForTimeout(700);
              const m=await page.evaluate(()=>({title:document.querySelector('.deck3bHero h1')?.textContent?.trim()||'',page:!!document.querySelector('.deck3bPage'),controls:!!document.querySelector('.deck3bControls'),grid:!!document.querySelector('.deck3bGrid'),version:window.PPCDecksRefinement?.version||'',overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth}));
              const broken=errors.length||!m.page||!m.controls||!m.grid||m.title!=='Your deck box'||m.version!=='8.65.2'||m.overflow>8;console.log(name,JSON.stringify({m,errors,broken}));if(broken)failures++;await context.close();}
            await browser.close();if(failures)process.exitCode=1})();
          NODE
          node decks-qa.js
