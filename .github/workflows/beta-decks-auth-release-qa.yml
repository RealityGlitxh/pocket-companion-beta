name: PocketNexus Deck + Auth Beta Release QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/beta-decks-auth-release-qa.yml"
      - "index.html"
      - "sw.js"
      - "privacy.html"
      - "terms.html"
      - "support.html"
      - "js/app/decks_meta.js"
      - "js/core/account-cloud-runtime-v8.64.1.js"
      - "js/core/account-cloud-core-v8.64.1.js"

permissions:
  contents: read

jobs:
  release-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POCKETNEXUS_QA_EMAIL: ${{ secrets.POCKETNEXUS_QA_EMAIL }}
      POCKETNEXUS_QA_PASSWORD: ${{ secrets.POCKETNEXUS_QA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify hosted release files match repository
        run: |
          set -euo pipefail
          for f in index.html sw.js privacy.html terms.html support.html; do
            curl -fsS --retry 3 --retry-delay 2 "https://beta.pocketnexus.app/$f?qa=${GITHUB_SHA}" -o "/tmp/$f"
            cmp "$f" "/tmp/$f" || { echo "::error::$f on beta.pocketnexus.app does not match checked-out release source"; exit 1; }
            echo "HOSTED_FILE_OK $f"
          done
      - name: Verify QA secrets are configured
        run: |
          test -n "$POCKETNEXUS_QA_EMAIL" && test -n "$POCKETNEXUS_QA_PASSWORD" || { echo "::error::QA account secrets are required"; exit 1; }
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run deck CRUD, import, validation, and sign-out QA
        run: |
          cat > beta-decks-auth-release-qa.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const root='https://beta.pocketnexus.app/';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1440,height:1000},serviceWorkers:'block'});
            const page=await ctx.newPage(), errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto(root,{waitUntil:'domcontentloaded',timeout:60000});
            const guest=page.getByRole('button',{name:/continue as guest/i});
            if(await guest.count())await guest.click({timeout:5000}).catch(()=>{});
            await page.waitForFunction(()=>typeof newDeck==='function'&&typeof validationDetails==='function'&&Array.isArray(CARDS)&&CARDS.length>=20,{timeout:30000});
            await page.evaluate(()=>{state.onboarding={...(state.onboarding||{}),completed:true,skipped:true};save();window.PPCWhatsNew?.close?.(true);document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop,#ppcWhatsNewBackdrop,.mobileMoreBackdrop').forEach(x=>x.remove())});
            const ids=await page.evaluate(async()=>{
              state.page='decks';render();newDeck();const id=state.selected,d=state.decks.find(x=>x.id===id);assertDeck=!!d;if(!d)throw Error('newDeck failed');
              d.name='QA Beta Deck';save();
              const basic=CARDS.find(c=>cardKind(c)==='Pokémon'&&/basic/i.test(String(c.stage||'')));if(!basic)throw Error('no Basic Pokemon in catalog');
              const chosen=[basic],seen=new Set([String(basic.name).toLowerCase()]);for(const c of CARDS){const k=String(c.name||'').toLowerCase();if(!k||seen.has(k))continue;seen.add(k);chosen.push(c);if(chosen.length===10)break}
              if(chosen.length<10)throw Error(`only ${chosen.length} unique cards available`);
              d.cards=Object.fromEntries(chosen.map(c=>[c.id,2]));save();
              if(deckCount(d)!==20||!isDeckLegal(d))throw Error(`20-card legality failed: ${validationDetails(d).join(' | ')}`);
              d.cards[chosen[0].id]=3;if(isDeckLegal(d)||!validationDetails(d).some(x=>/maximum is 2|copies/i.test(x)))throw Error('three-copy rule failed');
              d.cards[chosen[0].id]=1;if(!validationDetails(d).some(x=>/Add 1 more card/i.test(x)))throw Error('19-card rule failed');d.cards[chosen[0].id]=2;save();
              state.page='decks';render();const before=state.decks.length,box=document.getElementById('imp');if(!box||typeof importDeck!=='function')throw Error('import unavailable');box.value=chosen.map(c=>`2 ${c.name}`).join('\n');importDeck();await new Promise(r=>setTimeout(r,250));
              const imported=state.decks[state.decks.length-1];if(state.decks.length!==before+1||deckCount(imported)!==20||!isDeckLegal(imported))throw Error(`import failed: ${validationDetails(imported).join(' | ')}`);save();return{id,importedId:imported.id};
            });
            await page.reload({waitUntil:'domcontentloaded',timeout:60000});await page.waitForFunction(()=>Array.isArray(state?.decks));
            assert(await page.evaluate(({id,importedId})=>state.decks.some(d=>d.id===id&&d.name==='QA Beta Deck'&&deckCount(d)===20)&&state.decks.some(d=>d.id===importedId&&deckCount(d)===20),ids),'deck save/load failed');
            await page.evaluate(({id,importedId})=>{performDeckDelete(id);performDeckDelete(importedId);save()},ids);await page.reload({waitUntil:'domcontentloaded',timeout:60000});
            assert(await page.evaluate(({id,importedId})=>!state.decks.some(d=>d.id===id||d.id===importedId),ids),'deck delete persistence failed');
            assert(!errors.length,`deck runtime errors: ${errors.join(' | ')}`);console.log('DECK_CRUD_IMPORT_RULES_QA_OK');await ctx.close();

            const auth=await browser.newContext({viewport:{width:1440,height:1000},serviceWorkers:'block'}),p=await auth.newPage();const authErrors=[];p.on('pageerror',e=>authErrors.push(String(e.message||e)));
            await p.goto(root,{waitUntil:'domcontentloaded',timeout:60000});await p.waitForFunction(()=>window.getPPCCloudClient?.()?.auth&&typeof window.cloudSignOut==='function',{timeout:30000});
            const login=await p.evaluate(async({email,password})=>{const {data,error}=await getPPCCloudClient().auth.signInWithPassword({email,password});return{ok:!!data?.session,error:error?.message||''}},{email:process.env.POCKETNEXUS_QA_EMAIL,password:process.env.POCKETNEXUS_QA_PASSWORD});
            assert(login.ok,`QA sign-in failed: ${login.error}`);await p.waitForFunction(()=>window.getPPCCloudSession?.()?.user?.id&&state?.sessionMode==='cloud',{timeout:30000});
            await p.evaluate(()=>cloudSignOut());await p.waitForFunction(()=>!window.getPPCCloudSession?.()?.user?.id&&!state?.sessionMode,{timeout:30000});await p.reload({waitUntil:'domcontentloaded',timeout:60000});
            const out=await p.evaluate(()=>({uid:getPPCCloudSession?.()?.user?.id||'',mode:state?.sessionMode||'',recovery:/Runtime Recovery/i.test(document.body.innerText)}));assert(!out.uid&&!out.mode&&!out.recovery,`sign-out did not persist: ${JSON.stringify(out)}`);assert(!authErrors.length,`auth runtime errors: ${authErrors.join(' | ')}`);console.log('AUTH_SIGNOUT_PERSISTENCE_QA_OK');
            await auth.close();await browser.close();
          })().catch(e=>{console.error('BETA_DECKS_AUTH_RELEASE_QA_FAILURE',e);process.exit(1)});
          NODE
          node beta-decks-auth-release-qa.cjs
