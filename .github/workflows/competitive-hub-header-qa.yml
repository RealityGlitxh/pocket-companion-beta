name: PocketNexus Competitive Hub Header QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/competitive-hub-header-qa.yml"
      - "index.html"
      - "css/competitive-hub-v8.74.0.css"
      - "css/navigation.css"
      - "css/header-utility-menu-v8.64.2.css"
      - "js/features/competitive-hub-v8.74.0.js"
      - "js/core/navigation-v8.33.js"
      - "qa/competitive-hub-header-qa.cjs"

permissions:
  contents: read

jobs:
  header-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start isolated local beta
        run: |
          python3 -m http.server 8123 >/tmp/pn-header-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Run Competitive Hub header QA
        run: node qa/competitive-hub-header-qa.cjs
