name: PocketNexus Navigation Header QA

on:
  workflow_dispatch:
  push:
    branches: [main, navigation-header-final-polish-v8.76.0]
    paths:
      - ".github/workflows/navigation-header-final-qa.yml"
      - "css/header-utility-menu-v8.64.2.css"
      - "js/core/navigation-v8.33.js"
      - "qa/navigation-header-final-qa.cjs"
  pull_request:
    paths:
      - ".github/workflows/navigation-header-final-qa.yml"
      - "css/header-utility-menu-v8.64.2.css"
      - "js/core/navigation-v8.33.js"
      - "qa/navigation-header-final-qa.cjs"

permissions:
  contents: read

jobs:
  navigation-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start isolated local beta
        run: |
          python3 -m http.server 8123 >/tmp/pn-nav-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Run navigation/header QA
        run: node qa/navigation-header-final-qa.cjs
