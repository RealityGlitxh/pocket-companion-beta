name: PocketNexus Pass 3A Visual Regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pass3a-visual-regression.yml"
  workflow_dispatch:

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 8123 >/tmp/pocketnexus-http.log 2>&1 &
          echo $! > /tmp/pocketnexus-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done

      - name: Run visual regression sweep
        run: |
          mkdir -p visual-regression
          cat > pass3a-visual.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const viewports = [
            {name:'desktop', width:1440, height:900},
            {name:'tablet', width:820, height:1180},
            {name:'mobile', width:390, height:844}
          ];
          const routes = [
            ['home','dashboard'], ['decks','decks'], ['battle','matches'], ['meta','meta'],
            ['performance','stats'], ['collection','collection'], ['rank','rank'], ['streamer','streamer'],
            ['profiles','profile'], ['teamwars','teamwars'], ['training','training'], ['more','more'], ['account','account']
          ];
          const intentionalScrollSelectors = [
            '.matrixWrap','.metaMatchupScroll','.winLossChartScroll','.rankChartWrap','.twTabBar',
            '.collectionModes','.analyticsTabs','.cohesiveAnalyticsTabs','.coachQuickPrompts',
            '.managerRoster','.freeAgentGrid','.fixtureList','.streamPreview','.builderCatalog',
            '.wtcArtFrame','.brainTabsCompact'
          ];
          function safeName(s){ return s.replace(/[^a-z0-9_-]/gi,'-'); }

          (async()=>{
            const browser = await chromium.launch({headless:true});
            const report = [];
            let failures = 0;

            for (const vp of viewports){
              const context = await browser.newContext({viewport:{width:vp.width,height:vp.height}});
              const page = await context.newPage();
              const pageErrors = [];
              const consoleErrors = [];
              page.on('pageerror', e => pageErrors.push(String(e.message||e)));
              page.on('console', m => { if(m.type()==='error') consoleErrors.push(m.text()); });

              await page.goto('http://127.0.0.1:8123/index.html', {waitUntil:'domcontentloaded', timeout:30000});
              await page.waitForTimeout(1500);
              const guest = page.getByRole('button',{name:/continue as guest/i});
              if(await guest.count()) { try { await guest.click({timeout:3000}); await page.waitForTimeout(800); } catch{} }
              await page.evaluate(() => { try { if(typeof window.onboardingSkip==='function') window.onboardingSkip(); } catch{} });
              await page.waitForTimeout(500);

              for (const [label, route] of routes){
                pageErrors.length = 0; consoleErrors.length = 0;
                const routeResult = await page.evaluate((route) => {
                  try {
                    if (typeof window.goPage === 'function') window.goPage(route);
                    else { window.state.page = route; window.render?.(); }
                    return {ok:true};
                  } catch(e) { return {ok:false,error:String(e?.stack||e)}; }
                }, route);
                await page.waitForTimeout(route==='meta'?1000:700);

                const metrics = await page.evaluate((intentionalScrollSelectors) => {
                  const visible = el => {
                    const s=getComputedStyle(el), r=el.getBoundingClientRect();
                    return s.display!=='none' && s.visibility!=='hidden' && Number(s.opacity)!==0 && r.width>1 && r.height>1;
                  };
                  const intentional = el => intentionalScrollSelectors.some(sel => el.closest?.(sel));
                  const rootOverflow = Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - innerWidth;
                  const offenders=[];
                  for(const el of document.querySelectorAll('body *')){
                    if(!visible(el)||intentional(el)) continue;
                    const r=el.getBoundingClientRect(), style=getComputedStyle(el);
                    if(style.position==='fixed' || style.position==='absolute') continue;
                    const right=r.right-innerWidth, left=-r.left;
                    if(right>6 || left>6) offenders.push({tag:el.tagName,cls:String(el.className||'').slice(0,100),right:Math.round(right),left:Math.round(left),width:Math.round(r.width)});
                  }
                  const tinyControls=[];
                  for(const el of document.querySelectorAll('button,input,select,textarea,a')){
                    if(!visible(el)||intentional(el)) continue;
                    if(el.matches('input[type="checkbox"],input[type="radio"]')) continue;
                    const r=el.getBoundingClientRect();
                    if(r.height<28 || r.width<28) tinyControls.push({tag:el.tagName,text:(el.textContent||el.getAttribute('aria-label')||'').trim().slice(0,60),w:Math.round(r.width),h:Math.round(r.height)});
                  }
                  const clippedText=[];
                  for(const el of document.querySelectorAll('h1,h2,h3,p,strong,small,button,label')){
                    if(!visible(el)||intentional(el)) continue;
                    const s=getComputedStyle(el);
                    if(s.overflow==='hidden' && el.scrollWidth>el.clientWidth+4 && s.textOverflow!=='ellipsis') clippedText.push({tag:el.tagName,cls:String(el.className||'').slice(0,90),text:(el.textContent||'').trim().slice(0,70)});
                  }
                  const app=document.getElementById('app');
                  return {title:document.querySelector('#app h1')?.textContent?.trim()||'',rootOverflow:Math.round(rootOverflow),offenders:offenders.slice(0,12),tinyControls:tinyControls.slice(0,12),clippedText:clippedText.slice(0,12),appHeight:app?Math.round(app.getBoundingClientRect().height):0,bodyHeight:document.body.scrollHeight};
                }, intentionalScrollSelectors);

                const shot = `visual-regression/${vp.name}-${safeName(label)}.png`;
                await page.screenshot({path:shot, fullPage:true});
                const severeOverflow = metrics.rootOverflow > 8;
                const errorScreen = /this page hit an error/i.test(metrics.title);
                const noContent = metrics.appHeight < 80 || !metrics.title;
                const runtimeBroken = !routeResult.ok || pageErrors.length>0 || errorScreen;
                if(severeOverflow || noContent || runtimeBroken) failures++;
                report.push({viewport:vp.name,route,label,routeResult,metrics,pageErrors:[...new Set(pageErrors)].slice(0,8),consoleErrors:[...new Set(consoleErrors)].slice(0,8),severeOverflow,errorScreen,noContent,runtimeBroken,shot});
                console.log(`${vp.name.padEnd(7)} ${label.padEnd(12)} overflow=${metrics.rootOverflow}px offenders=${metrics.offenders.length} tiny=${metrics.tinyControls.length} clipped=${metrics.clippedText.length} errors=${pageErrors.length} errorScreen=${errorScreen} title=${JSON.stringify(metrics.title)}`);
              }
              await context.close();
            }

            fs.writeFileSync('visual-regression/report.json', JSON.stringify({failures,report},null,2));
            const lines=['# PocketNexus Pass 3A Visual Regression','',`Failures: ${failures}`,''];
            for(const r of report){
              lines.push(`## ${r.viewport} — ${r.label}`);
              lines.push(`- title: ${r.metrics.title||'(none)'}`);
              lines.push(`- horizontal overflow: ${r.metrics.rootOverflow}px`);
              lines.push(`- overflow offenders: ${r.metrics.offenders.length}`);
              lines.push(`- tiny controls: ${r.metrics.tinyControls.length}`);
              lines.push(`- clipped text suspects: ${r.metrics.clippedText.length}`);
              lines.push(`- page errors: ${r.pageErrors.length}`);
              lines.push(`- error screen: ${r.errorScreen?'yes':'no'}`);
              if(r.metrics.offenders.length) lines.push('```json\n'+JSON.stringify(r.metrics.offenders,null,2)+'\n```');
              if(r.pageErrors.length) lines.push('```text\n'+r.pageErrors.join('\n')+'\n```');
              lines.push('');
            }
            fs.writeFileSync('visual-regression/report.md', lines.join('\n'));
            await browser.close();
            if(failures) process.exitCode=1;
          })();
          NODE
          node pass3a-visual.js

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass3a-visual-regression
          path: visual-regression/
          retention-days: 7
