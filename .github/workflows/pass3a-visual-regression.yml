name: PocketNexus Pass 3A Visual Regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pass3a-visual-regression.yml"
  workflow_dispatch:

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8123 >/tmp/pocketnexus-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Run visual regression sweep
        run: |
          mkdir -p visual-regression
          cat > pass3a-visual.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const viewports=[{name:'desktop',width:1440,height:900},{name:'tablet',width:820,height:1180},{name:'mobile',width:390,height:844}];
          const routes=[['home','dashboard'],['decks','decks'],['battle','matches'],['meta','meta'],['performance','stats'],['collection','collection'],['rank','rank'],['streamer','streamer'],['profiles','profile'],['teamwars','teamwars'],['training','training'],['more','more'],['account','account']];
          const intentional=['.matrixWrap','.metaMatchupScroll','.winLossChartScroll','.rankChartWrap','.twTabBar','.collectionModes','.analyticsTabs','.cohesiveAnalyticsTabs','.coachQuickPrompts','.managerRoster','.freeAgentGrid','.fixtureList','.streamPreview','.builderCatalog','.wtcArtFrame','.brainTabsCompact'];
          const safe=s=>s.replace(/[^a-z0-9_-]/gi,'-');
          (async()=>{const browser=await chromium.launch({headless:true});const report=[];let failures=0;
            for(const vp of viewports){const context=await browser.newContext({viewport:{width:vp.width,height:vp.height}}),page=await context.newPage();const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e.message||e)));
              await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded',timeout:30000});await page.waitForTimeout(1500);
              const guest=page.getByRole('button',{name:/continue as guest/i});if(await guest.count())try{await guest.click({timeout:3000});await page.waitForTimeout(800)}catch{}
              await page.evaluate(()=>{try{window.onboardingSkip?.()}catch{};document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop').forEach(x=>x.remove())});await page.waitForTimeout(400);
              for(const [label,route] of routes){pageErrors.length=0;const rr=await page.evaluate(route=>{try{window.goPage?window.goPage(route):(window.state.page=route,window.render?.());return{ok:true}}catch(e){return{ok:false,error:String(e?.stack||e)}}},route);await page.waitForTimeout(route==='meta'?1000:700);await page.evaluate(()=>document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop').forEach(x=>x.remove()));
                const m=await page.evaluate(intentional=>{const visible=el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>1&&r.height>1},intentionalEl=el=>intentional.some(sel=>el.closest?.(sel)),rootOverflow=Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth,offenders=[],tinyControls=[],clippedText=[];
                  for(const el of document.querySelectorAll('body *')){if(!visible(el)||intentionalEl(el))continue;const r=el.getBoundingClientRect(),s=getComputedStyle(el);if(s.position==='fixed'||s.position==='absolute')continue;const right=r.right-innerWidth,left=-r.left;if(right>6||left>6)offenders.push({tag:el.tagName,cls:String(el.className||'').slice(0,100),right:Math.round(right),left:Math.round(left),width:Math.round(r.width)})}
                  for(const el of document.querySelectorAll('button,input,select,textarea,a')){if(!visible(el)||intentionalEl(el)||el.matches('input[type="checkbox"],input[type="radio"]'))continue;const r=el.getBoundingClientRect();if(r.height<28||r.width<28)tinyControls.push({tag:el.tagName,text:(el.textContent||el.getAttribute('aria-label')||'').trim().slice(0,60),w:Math.round(r.width),h:Math.round(r.height)})}
                  for(const el of document.querySelectorAll('h1,h2,h3,p,strong,small,button,label')){if(!visible(el)||intentionalEl(el))continue;const s=getComputedStyle(el);if(s.overflow==='hidden'&&el.scrollWidth>el.clientWidth+4&&s.textOverflow!=='ellipsis')clippedText.push({tag:el.tagName,cls:String(el.className||'').slice(0,90),text:(el.textContent||'').trim().slice(0,70)})}
                  const app=document.getElementById('app');return{title:document.querySelector('#app h1')?.textContent?.trim()||'',rootOverflow:Math.round(rootOverflow),offenders:offenders.slice(0,12),tinyControls:tinyControls.slice(0,12),clippedText:clippedText.slice(0,12),appHeight:app?Math.round(app.getBoundingClientRect().height):0}},intentional);
                await page.screenshot({path:`visual-regression/${vp.name}-${safe(label)}.png`,fullPage:true});const errorScreen=/this page hit an error/i.test(m.title),broken=!rr.ok||pageErrors.length>0||errorScreen,severe=m.rootOverflow>8,noContent=m.appHeight<80||!m.title;if(broken||severe||noContent)failures++;report.push({viewport:vp.name,label,route,metrics:m,pageErrors:[...new Set(pageErrors)],errorScreen,broken,severe,noContent});console.log(`${vp.name} ${label} overflow=${m.rootOverflow} offenders=${m.offenders.length} tiny=${m.tinyControls.length} clipped=${m.clippedText.length} errors=${pageErrors.length} title=${JSON.stringify(m.title)}`)}await context.close()}
            fs.writeFileSync('visual-regression/report.json',JSON.stringify({failures,report},null,2));await browser.close();if(failures)process.exitCode=1})();
          NODE
          node pass3a-visual.js
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass3a-visual-regression
          path: visual-regression/
          retention-days: 7
