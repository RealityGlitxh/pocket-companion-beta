name: PocketNexus Pass 3A Regression Repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pass3a-regression-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair Battle lazy-rank dependency and Training mobile width
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('js/app/performance.js')
          s=p.read_text()
          marker='function rankedBattleSnapshot(){'
          if marker not in s:
              raise SystemExit('rankedBattleSnapshot marker missing')
          helpers='''function battleRankSessionService(){return window.PPCRankSessionService||null}\nfunction battleRankBorderService(){return window.PPCRankBorderService||null}\nfunction battleRankFmt(n){return Number.isFinite(Number(n))?Number(n).toLocaleString():"—"}\nfunction battleRankTargetLabel(rank){return rank===100?"Top 100":rank===1000?"Top 1K":rank===5000?"Top 5K":rank===10000?"Top 10K":`Top ${rank}`}\nfunction battleRankSessionStatusMessage(status){\n const x=String(status||"");\n if(x==="no-active-season")return "No ranked season is active yet.";\n if(x==="authentication-required")return "Sign in to sync your Master Ball streak and RP.";\n if(x==="no-session")return "Start your Master Ball session to enable streak-aware RP tracking.";\n if(x==="session-not-found")return "This rank session could not be found for your account.";\n if(x==="invalid-starting-rp")return "Enter a valid starting RP.";\n return x||"Rank session is not available.";\n}\nfunction battleRankSessionApply(payload){\n const sess=payload?.session;if(!sess)return;\n state.rank=state.rank||{};\n state.rank.tier="Master Ball";\n state.rank.points=Number(sess.current_rp||0);\n state.rank.streak=Number(sess.current_win_streak||0);\n save();\n}\n'''
          if 'function battleRankSessionService(){' not in s:
              s=s.replace(marker, helpers+marker, 1)

          start=s.index('async function performUndoLastBattleMatch()')
          end=s.index('function dismissBattleNotice()', start)
          end2=s.index('\n', end)
          # Include the Battle rank overview/result helpers through battleResultSummaryHtml,
          # stopping before the next unrelated section marker if available.
          stop=s.find('// V8.21.1 Battle Sessions Cleanup', start)
          # replacements span both undo and the V8.21 cleanup section, so use a later boundary.
          later=s.find('function quickRecordResult', start)
          if later == -1:
              later=s.find('function battleSession', start)
          if later == -1:
              later=min(len(s), start+22000)
          segment=s[start:later]
          replacements={
            'rankSessionService()':'battleRankSessionService()',
            'rankSessionStatusMessage(':'battleRankSessionStatusMessage(',
            'rankSessionApply(':'battleRankSessionApply(',
            'rankBorderService()':'battleRankBorderService()',
            'rankBorderLabel(':'battleRankTargetLabel(',
            'rankBorderFmt(':'battleRankFmt('
          }
          for a,b in replacements.items(): segment=segment.replace(a,b)
          s=s[:start]+segment+s[later:]
          p.write_text(s)

          css=Path('css/pass3a-utility-v8.65.0.css')
          c=css.read_text()
          fix='''\n\n/* Pass 3A visual-regression repair — keep Training inside narrow viewports. */\n@media(max-width:760px){\n  #app:has(.trainingHeroV864){width:100%!important;max-width:100%!important;min-width:0!important;overflow-x:hidden!important}\n  .trainingHeroV864,.wtcLayout,.wtcGame,.wtcLayout>aside,.trainingProgressPanel,.brainTrainingCompact{width:100%!important;max-width:100%!important;min-width:0!important;box-sizing:border-box!important}\n  .trainingHeroV864>*,.wtcLayout>*,.wtcGame>*,.brainTrainingCompact>*{min-width:0!important;max-width:100%!important;box-sizing:border-box!important}\n  .wtcLayout{grid-template-columns:minmax(0,1fr)!important}\n  .wtcInputRow,.wtcAutocomplete,.wtcGuessBox,.wtcHistory{min-width:0!important;max-width:100%!important}\n  .wtcArtFrame{width:100%!important;max-width:100%!important;overflow:hidden!important}\n}\n'''
          if 'Pass 3A visual-regression repair' not in c:
              c += fix
          css.write_text(c)

          idx=Path('index.html')
          h=idx.read_text().replace('css/pass3a-utility-v8.65.0.css?v=865005','css/pass3a-utility-v8.65.0.css?v=865006')
          idx.write_text(h)
          PY

          node --check js/app/performance.js
          grep -nE 'rankSessionService|rankSessionStatusMessage|rankSessionApply|rankBorderService|rankBorderLabel|rankBorderFmt' js/app/performance.js && true
          grep -q 'battleRankSessionService' js/app/performance.js
          grep -q 'Pass 3A visual-regression repair' css/pass3a-utility-v8.65.0.css
          grep -q 'pass3a-utility-v8.65.0.css?v=865006' index.html

      - name: Commit repair
        run: |
          git config user.name "PocketNexus QA"
          git config user.email "actions@users.noreply.github.com"
          git add js/app/performance.js css/pass3a-utility-v8.65.0.css index.html
          if git diff --cached --quiet; then
            echo "No repair changes needed"
          else
            git commit -m "fix: repair Pass 3A Battle and Training regressions"
            git push origin HEAD:main
          fi
