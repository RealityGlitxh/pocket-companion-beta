name: PocketNexus Pass 3B-5 Collection Inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pass3b-collection-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Collection API and controls
        run: |
          echo '=== COLLECTION FUNCTIONS ==='
          grep -RhoE 'function [A-Za-z0-9_]*Collection[A-Za-z0-9_]*\(' js | sort -u || true
          echo '=== COLLECTION BULK DEFINITIONS/REFERENCES ==='
          grep -RnE 'collectionBulkToolbarHtml|collectionBulkMode|toggleCollectionCardSelection|Claim all|Claim All|Select all|Select All|Bulk edit|bulk edit' js | head -220 || true
          echo '=== COLLECTION PREF/MODE DEFINITIONS ==='
          grep -RnE 'function toggleCollectionQuickEdit|function setCollectionMode|function collectionFiltered|COLLECTION_PAGE_SIZE|collectionPageIndex' js | head -180 || true
