name: PocketNexus Pass 3B Home QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pass3b-home-qa.yml"
  workflow_dispatch:

jobs:
  home-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8123 >/tmp/pn-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Capture and validate Home
        run: |
          mkdir -p home-qa
          cat > /tmp/home-qa.js <<'NODE'
          const { chromium }=require('playwright');
          const fs=require('fs');
          const viewports=[['desktop',1440,900],['tablet',820,1180],['mobile',390,844]];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const results=[];let failures=0;
            for(const [name,width,height] of viewports){
              const context=await browser.newContext({viewport:{width,height},serviceWorkers:'block'});
              const page=await context.newPage();const errors=[];
              page.on('pageerror',e=>errors.push(String(e.message||e)));
              await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1400);
              const guest=page.getByRole('button',{name:/continue as guest/i});if(await guest.count())try{await guest.click({timeout:2500});await page.waitForTimeout(650)}catch{}
              await page.evaluate(()=>{try{window.onboardingSkip?.()}catch{};document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop').forEach(x=>x.remove())});
              await page.evaluate(()=>window.goPage?.('dashboard'));await page.waitForTimeout(700);
              const metrics=await page.evaluate(()=>{
                const app=document.getElementById('app'),hero=document.querySelector('.home3bHero'),primary=document.querySelector('.homePrimaryAction');
                const overflow=Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth;
                let ensureCalls=0;
                if(window.PPCMetaService?.ensure){const old=window.PPCMetaService.ensure;window.PPCMetaService.ensure=(...a)=>{ensureCalls++;return old.apply(window.PPCMetaService,a)};window.dashboard?.();window.PPCMetaService.ensure=old;}
                return {title:app?.querySelector('h1')?.textContent?.trim()||'',overflow:Math.round(overflow),hero:!!hero,primary:primary?.textContent?.trim()||'',ensureCalls,homeVersion:window.PPCHomeRefinement?.version||'',appHeight:Math.round(app?.getBoundingClientRect().height||0)};
              });
              await page.screenshot({path:`home-qa/${name}.png`,fullPage:true});
              const broken=errors.length>0||!metrics.hero||metrics.title!=='Ready for your next game?'||!/Record Battle/.test(metrics.primary)||metrics.overflow>8||metrics.ensureCalls!==0||metrics.homeVersion!=='8.65.1'||metrics.appHeight<200;
              if(broken)failures++;
              results.push({name,width,height,metrics,errors,broken});
              console.log(name,JSON.stringify({metrics,errors,broken}));
              await context.close();
            }
            fs.writeFileSync('home-qa/report.json',JSON.stringify({failures,results},null,2));
            await browser.close();if(failures)process.exitCode=1;
          })();
          NODE
          node /tmp/home-qa.js
      - name: Upload Home QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass3b-home-qa
          path: home-qa/
          retention-days: 7
