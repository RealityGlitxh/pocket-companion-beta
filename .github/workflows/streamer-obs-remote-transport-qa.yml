name: PocketNexus Remote OBS Transport QA

on:
  push:
    branches: [main]
    paths:
      - "overlay*.html"
      - "js/features/streamer-obs-remote-transport-v8.71.0.js"
      - "js/features/streamer-obs-system-v8.68.0.js"
      - "js/features/route-feature-loader-v8.64.1.js"
      - "supabase/migrations/*stream_overlay*"
      - ".github/workflows/streamer-obs-remote-transport-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-obs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 8123 >/tmp/pn-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Verify independent OBS browser-source transport
        run: |
          cat > remote-obs-qa.js <<'NODE'
          const {chromium}=require('playwright');
          const mark=x=>console.log(`REMOTE_OBS_CHECKPOINT ${x}`);
          (async()=>{
            const failures=[];mark('launch');const browser=await chromium.launch({headless:true});
            const controlCtx=await browser.newContext({viewport:{width:1440,height:900},serviceWorkers:'block'});
            const control=await controlCtx.newPage();control.setDefaultTimeout(15000);control.setDefaultNavigationTimeout(15000);const controlErrors=[];control.on('pageerror',e=>controlErrors.push(String(e.message||e)));
            mark('control-open');await control.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded'});await control.waitForTimeout(1200);
            const guest=control.getByRole('button',{name:/continue as guest/i});if(await guest.count())try{await guest.click({timeout:2500})}catch{}
            await control.evaluate(()=>{document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop,#ppcWhatsNewBackdrop,[role="dialog"]').forEach(x=>x.remove());window.goPage?.('streamer')});
            await control.waitForFunction(()=>!!window.PPCStreamerOBSRemote&&!!window.PPCStreamerOBS2);mark('remote-loaded');
            await control.evaluate(()=>{
              state.rank={...(state.rank||{}),tier:'Master Ball',points:1234,streak:2};
              state.decks=[{id:'obs-qa-deck',name:'OBS QA Deck',archetype:'QA Archetype',energy:'Water',cards:[]}];
              state.streamer.controlDeckId='obs-qa-deck';state.streamer.overlayMode='tournament';state.battlePrefs=state.battlePrefs||{};state.battlePrefs.lastDeckId='obs-qa-deck';state.matches=[];save();
            });
            const created=await control.evaluate(async()=>{await PPCStreamerOBSRemote.ensureRemote();await PPCStreamerOBSRemote.publish(true);return {url:PPCStreamerOBSRemote.sourceUrl('tournament'),creds:PPCStreamerOBSRemote.readCreds(),expected:PPCStreamerOBSRemote.buildState().modes.tournament,active:PPCStreamerOBSRemote.buildState().activeMode}});mark('remote-created');
            if(!created.url.includes('overlay=')||!created.creds?.overlay_id||!created.creds?.write_token)failures.push({type:'create',created});
            if(/[?&]mode=/i.test(created.url))failures.push({type:'mode-pinned-url',url:created.url});
            if(/write_token|access_token|authorization|apikey=/i.test(created.url))failures.push({type:'secret-in-url',url:created.url});
            if(created.active!=='tournament')failures.push({type:'initial-active-mode',active:created.active});

            const obsCtx=await browser.newContext({viewport:{width:1920,height:1080},serviceWorkers:'block'});const obs=await obsCtx.newPage();obs.setDefaultTimeout(15000);obs.setDefaultNavigationTimeout(15000);await obs.route('https://cdn.jsdelivr.net/**',r=>r.abort());const obsErrors=[];obs.on('pageerror',e=>obsErrors.push(String(e.message||e)));
            mark('obs-open');await obs.goto(created.url,{waitUntil:'domcontentloaded'});
            await obs.waitForFunction(()=>typeof d!=='undefined'&&d&&d.config?.overlayMode==='tournament'&&d.rank&&d.rank.points===1234);mark('obs-initial');
            const initial=await obs.evaluate(()=>({points:d.rank.points,deck:d.deck?.name,mode:d.config?.overlayMode,record:d.record,hasLocal:!!localStorage.getItem('ppc_stream_overlay_v83'),body:document.body.innerText}));
            if(initial.points!==1234||initial.deck!=='OBS QA Deck'||initial.mode!=='tournament'||initial.hasLocal||!/TOURNAMENT MODE/i.test(initial.body))failures.push({type:'initial-independent',initial});

            await control.evaluate(()=>{state.streamer.overlayMode='ranked';save()});
            await control.evaluate(async()=>{await PPCStreamerOBSRemote.publish(true)});mark('mode-ranked-published');
            await obs.waitForFunction(()=>d&&d.config?.overlayMode==='ranked');
            await obs.waitForFunction(()=>/LIVE RANK/i.test(document.body.innerText)&&!/TOURNAMENT MODE/i.test(document.body.innerText));mark('obs-followed-ranked');
            const modeSwitch=await obs.evaluate(()=>({mode:d.config?.overlayMode,body:document.body.innerText}));
            if(modeSwitch.mode!=='ranked'||!/LIVE RANK/i.test(modeSwitch.body)||/TOURNAMENT MODE/i.test(modeSwitch.body))failures.push({type:'mode-follow',modeSwitch});

            await control.evaluate(()=>{
              state.rank={...(state.rank||{}),tier:'Master Ball',points:1301,streak:3};
              state.matches.push({id:'obs-win-1',timestamp:Date.now(),deckId:'obs-qa-deck',deckName:'OBS QA Deck',deckArchetype:'QA Archetype',opponentArchetype:'QA Opponent',result:'win',turnOrder:'first',gameMode:'ranked',rankBefore:{tier:'Master Ball',points:1234},rankAfter:{tier:'Master Ball',points:1301},rankChange:67});
              state.decks[0].name='OBS QA Deck Updated';save();
            });
            const expected=await control.evaluate(async()=>{await PPCStreamerOBSRemote.publish(true);return PPCStreamerOBSRemote.buildState().modes.ranked});mark('control-updated');
            await obs.waitForFunction(e=>d&&d.rank?.points===e.points&&d.deck?.name===e.deck&&d.record?.wins===e.wins,{points:expected.rank.points,deck:expected.deck.name,wins:expected.record.wins});mark('obs-updated');
            const updated=await obs.evaluate(()=>({points:d.rank.points,deck:d.deck.name,wins:d.record.wins,losses:d.record.losses,mode:d.config?.overlayMode}));
            if(updated.points!==expected.rank.points||updated.deck!==expected.deck.name||updated.wins!==expected.record.wins||updated.mode!=='ranked')failures.push({type:'live-update',updated,expected:{rank:expected.rank,deck:expected.deck,record:expected.record}});

            await obs.reload({waitUntil:'domcontentloaded'});await obs.waitForFunction(e=>d&&d.rank?.points===e.points&&d.deck?.name===e.deck&&d.config?.overlayMode==='ranked',{points:expected.rank.points,deck:expected.deck.name});mark('obs-reload');
            const restored=await obs.evaluate(()=>({points:d.rank.points,deck:d.deck.name,mode:d.config?.overlayMode}));
            if(restored.points!==expected.rank.points||restored.deck!==expected.deck.name||restored.mode!=='ranked')failures.push({type:'reload-restore',restored});

            const bad=await obsCtx.newPage();bad.setDefaultNavigationTimeout(15000);await bad.route('https://cdn.jsdelivr.net/**',r=>r.abort());await bad.goto('http://127.0.0.1:8123/overlay.html?overlay=00000000-0000-4000-8000-000000000001',{waitUntil:'domcontentloaded'});await bad.waitForTimeout(3500);const badText=await bad.locator('body').innerText();if(!/Overlay Not Found|Connection Issue/i.test(badText))failures.push({type:'invalid-diagnostic',badText});await bad.close();mark('invalid-safe');

            const oldUrl=created.url;const newUrl=await control.evaluate(async()=>await PPCStreamerOBSRemote.regenerate());mark('regenerated');
            if(!newUrl||newUrl===oldUrl)failures.push({type:'regenerate',oldUrl,newUrl});
            if(/[?&]mode=/i.test(newUrl))failures.push({type:'regenerated-mode-pinned-url',newUrl});
            await obs.goto(oldUrl,{waitUntil:'domcontentloaded'});await obs.waitForTimeout(3500);const revokedText=await obs.locator('body').innerText();if(!/Overlay Revoked/i.test(revokedText))failures.push({type:'revocation',revokedText});mark('revoked-safe');

            if(controlErrors.length)failures.push({type:'control-pageerrors',controlErrors});if(obsErrors.length)failures.push({type:'obs-pageerrors',obsErrors});
            await obsCtx.close();await controlCtx.close();await browser.close();
            console.log('REMOTE_OBS_QA_RESULTS',JSON.stringify(failures,null,2));
            if(failures.length){console.error('REMOTE_OBS_QA_FAILURES',failures.length);process.exit(1)}
            console.log('REMOTE_OBS_TRANSPORT_QA_OK');
          })().catch(e=>{console.error('REMOTE_OBS_FATAL',e);process.exit(1)});
          NODE
          timeout 150s node remote-obs-qa.js
