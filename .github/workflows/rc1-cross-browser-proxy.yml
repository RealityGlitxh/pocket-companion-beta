name: PocketNexus RC1 Cross-Browser Proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rc1-cross-browser-proxy.yml"
      - "index.html"
      - "js/features/rc1-route-class-cleanup-v8.65.0.js"

permissions:
  contents: read

jobs:
  cross-browser-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright browsers
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
      - name: Start isolated RC1 site
        run: |
          python3 -m http.server 8123 >/tmp/pn-rc1-cross-browser.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Run Safari Chrome Edge proxy matrix
        run: |
          cat > rc1-cross-browser-proxy.cjs <<'NODE'
          const {chromium,webkit}=require('playwright');
          const routes=['dashboard','decks','matches','rank','meta','collection','profile','training','more','about'];
          const matrix=[
            {name:'safari-ios-proxy',engine:webkit,viewport:{width:390,height:844},mobile:true,touch:true},
            {name:'safari-desktop-proxy',engine:webkit,viewport:{width:1440,height:900},mobile:false,touch:false},
            {name:'chrome-mobile-proxy',engine:chromium,viewport:{width:390,height:844},mobile:true,touch:true},
            {name:'chrome-desktop-proxy',engine:chromium,viewport:{width:1440,height:900},mobile:false,touch:false},
            {name:'edge-desktop-proxy',engine:chromium,viewport:{width:1440,height:900},mobile:false,touch:false,userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36 Edg/140.0.0.0'}
          ];
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          function assertOverflow(cfg,scope,overflow){
            if(overflow<=12)return;
            throw new Error(`${cfg.name}/${scope}: horizontal overflow ${overflow}px`);
          }
          function expectedLocalWebkitSupabaseError(cfg,message,currentUrl){
            return cfg.engine===webkit &&
              /^http:\/\/127\.0\.0\.1:8123\//.test(currentUrl) &&
              /access control checks/i.test(message) &&
              /get_combined_competitive_meta|get_combined_matchup_matrix/i.test(message);
          }
          (async()=>{
            const failures=[];
            for(const cfg of matrix){
              const browser=await cfg.engine.launch({headless:true});
              const context=await browser.newContext({viewport:cfg.viewport,isMobile:cfg.mobile,hasTouch:cfg.touch,userAgent:cfg.userAgent,serviceWorkers:'block'});
              const page=await context.newPage(); const fatal=[];
              page.on('pageerror',e=>{
                const message=String(e.message||e);
                if(expectedLocalWebkitSupabaseError(cfg,message,page.url())){
                  console.warn('RC1_PROXY_ADVISORY',`${cfg.name}: local-origin Supabase Meta fallback ${message}`);
                  return;
                }
                fatal.push(`pageerror: ${message}`);
              });
              page.on('console',m=>{if(m.type()==='error'&&!/favicon|Failed to load resource/i.test(m.text()))fatal.push(`console: ${m.text()}`)});
              try{
                await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForFunction(()=>typeof window.goPage==='function',{timeout:20000});
                const guest=page.getByRole('button',{name:/continue as guest/i});
                if(await guest.count())await guest.click({timeout:2500}).catch(()=>{});
                await page.evaluate(()=>{
                  state.onboarding={...(state.onboarding||{}),completed:true,skipped:true}; if(typeof save==='function')save();
                  window.PPCWhatsNew?.close?.(true);
                  const version=String(window.PPCWhatsNew?.version||'8.64.1').replaceAll('.','_');
                  localStorage.setItem(`ppc_whats_new_seen_${version}`,'seen');
                  document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop,#ppcWhatsNewBackdrop,.mobileMoreBackdrop').forEach(x=>x.remove());
                });
                for(const route of routes){
                  await page.evaluate(r=>window.goPage?.(r),route); await page.waitForTimeout(350);
                  const s=await page.evaluate(()=>({text:(document.querySelector('#app')?.innerText||'').trim().length,recovery:/Runtime recovery|This page hit an error/i.test(document.body.innerText),overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth}));
                  assert(s.text>20,`${cfg.name}/${route}: blank route`);
                  assert(!s.recovery,`${cfg.name}/${route}: runtime recovery/error surface`);
                  assertOverflow(cfg,route,s.overflow);
                }
                await page.evaluate(()=>window.goPage?.('meta')); await page.waitForTimeout(450);
                for(const label of ['24H','7D','14D','30D']){
                  const b=page.getByRole('button',{name:label,exact:true});
                  if(await b.count()){await b.click({timeout:3000});await page.waitForTimeout(120)}
                }
                await page.evaluate(()=>window.goPage?.('training')); await page.waitForTimeout(350);
                if(cfg.mobile){
                  await page.setViewportSize({width:844,height:390}); await page.waitForTimeout(250);
                  let o=await page.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth);assertOverflow(cfg,'landscape',o);
                  await page.setViewportSize({width:390,height:844}); await page.waitForTimeout(250);
                  o=await page.evaluate(()=>Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth);assertOverflow(cfg,'portrait-return',o);
                }
                await page.reload({waitUntil:'domcontentloaded',timeout:30000}); await page.waitForTimeout(700);
                const reload=await page.evaluate(()=>({text:(document.querySelector('#app')?.innerText||'').trim().length,recovery:/Runtime recovery|This page hit an error/i.test(document.body.innerText),overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth}));
                assert(reload.text>20&&!reload.recovery,`${cfg.name}: reload regression ${JSON.stringify(reload)}`);
                assertOverflow(cfg,'reload',reload.overflow);
                assert(fatal.length===0,`${cfg.name}: runtime errors ${fatal.join(' | ')}`);
                console.log('RC1_PROXY_OK',cfg.name);
              }catch(e){failures.push({browser:cfg.name,error:String(e.message||e)});console.error('RC1_PROXY_FAILURE',cfg.name,e)}
              await context.close(); await browser.close();
            }
            console.log('RC1_CROSS_BROWSER_PROXY_RESULTS',JSON.stringify(failures,null,2));
            if(failures.length)process.exit(1);
            console.log('RC1_CROSS_BROWSER_PROXY_OK');
          })();
          NODE
          node rc1-cross-browser-proxy.cjs
