name: PocketNexus Rank Battle Ended Season Integration QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rank-battle-ended-integration-qa.yml"
      - "js/app/rank_tools-v8.64.1.js"
      - "js/features/rank-ended-season-hotfix-v8.64.2.js"
      - "js/services/rank-session-service.js"
      - "js/app/battle_gym.js"
      - "index.html"

permissions:
  contents: read

jobs:
  rank-battle-ended-integration-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 8123 >/tmp/pn-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Run Rank Battle ended-season integration QA
        run: |
          cat > rank-battle-ended-integration-qa.js <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1200);
            const guest=page.getByRole('button',{name:/continue as guest/i});
            if(await guest.count())try{await guest.click({timeout:2500});await page.waitForTimeout(400)}catch{}
            await page.evaluate(()=>window.goPage?.('rank'));
            await page.evaluate(async()=>{if(window.PPCFeatureLoader?.loadRoute)await window.PPCFeatureLoader.loadRoute('rank')});
            await page.waitForFunction(()=>typeof rankSessionRecord==='function'&&typeof rankBorderQuickSummary==='function',{timeout:10000}).catch(()=>{});
            const result=await page.evaluate(async()=>{
              const missing={rankSessionRecord:typeof rankSessionRecord!=='function',rankBorderQuickSummary:typeof rankBorderQuickSummary!=='function'};
              if(missing.rankSessionRecord||missing.rankBorderQuickSummary)return {missing:true,missingHelpers:missing};
              state.rank=state.rank||{}; state.rank.points=900; state.rank.tier='Master Ball';
              let session={id:'qa-session',current_rp:900,current_win_streak:0,best_win_streak:0,wins:0,losses:0,ties:0,streak_bonus_rp:0,total_rp_gained:0};
              window.PPCRankSessionService={
                getData:()=>({ok:true,status:'session-active',session}),
                record:async(id,res)=>{session={...session,current_rp:910,current_win_streak:1,best_win_streak:1,wins:1,total_rp_gained:10};return {ok:true,sessionId:id,currentRP:910,currentStreak:1,bestStreak:1,wins:1,losses:0,ties:0,rpChange:10,streakBonus:0};}
              };
              await rankSessionRecord('win');
              const html=rankBorderQuickSummary({targetRank:1000,predictedFinalRP:1975,recommendedSafeRP:2025,confidence:'medium'},{state:'ended',label:'Season ended',live:false});
              const host=document.createElement('div'); host.innerHTML=html; const text=(host.textContent||'').replace(/\s+/g,' ').trim();
              return {
                missing:false,
                rp:Number(state.rank?.points||0),
                streak:Number(state.rank?.streak||0),
                text,
                ended:/Season ended/i.test(text)&&/historical/i.test(text),
                actionable:/RP to go|About\s+[\d,]+\s+RP to the estimated safety target|need about/i.test(text),
                runtimeError:document.querySelector('.runtimeError .dangerBox')?.innerText||'',
                overflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth)
              };
            });
            console.log('RANK_BATTLE_ENDED_INTEGRATION_RESULT',JSON.stringify({result,errors},null,2));
            await browser.close();
            if(result.missing||result.rp!==910||result.streak!==1||!result.ended||result.actionable||result.runtimeError||result.overflow>2||errors.length)process.exit(1);
            console.log('RANK_BATTLE_ENDED_INTEGRATION_OK');
          })();
          NODE
          node rank-battle-ended-integration-qa.js
