name: PocketNexus Streamer Tournament Auto Link QA

on:
  push:
    branches: [main]
    paths:
      - 'js/features/streamer-tournament-auto-link-v8.73.1.js'
      - 'js/features/streamer-tournament-manual-player-follow-v8.72.3.js'
      - 'js/features/streamer-tournament-switch-hotfix-v8.78.2.js'
      - 'js/features/streamer-tournament-hidden-input-hotfix-v8.78.3.js'
      - 'js/features/route-feature-loader-v8.64.1.js'
      - 'js/services/limitless-live-table-service-v8.68.1.js'
      - 'js/features/streamer-limitless-live-table-v8.68.3.js'
      - 'js/app/streamer_tools-v8.64.1.js'
      - 'supabase/functions/limitless-refresh/index.ts'
      - 'qa/streamer-tournament-auto-link-qa.mjs'
      - '.github/workflows/streamer-tournament-auto-link-qa.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tournament-auto-link:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify automatic tournament overlay link
        run: node qa/streamer-tournament-auto-link-qa.mjs
      - name: Verify tournament switch hotfix contract
        run: |
          grep -q "PPCStreamerTournamentSwitchHotfix" js/features/streamer-tournament-switch-hotfix-v8.78.2.js
          grep -q "clearDerivedTournamentState" js/features/streamer-tournament-switch-hotfix-v8.78.2.js
          grep -q "PPCStreamerOBSRemote?.publish?.(true)" js/features/streamer-tournament-switch-hotfix-v8.78.2.js
          grep -q "streamer-tournament-switch-hotfix-v8.78.2.js?v=878200" js/features/route-feature-loader-v8.64.1.js
      - name: Verify stale hidden tournament input regression guard
        run: |
          grep -q "PPCStreamerTournamentHiddenInputHotfix" js/features/streamer-tournament-hidden-input-hotfix-v8.78.3.js
          grep -q "syncHiddenTournamentInput" js/features/streamer-tournament-hidden-input-hotfix-v8.78.3.js
          grep -q "pnLiveTournament" js/features/streamer-tournament-hidden-input-hotfix-v8.78.3.js
          grep -q "PPCStreamerLimitlessLiveTable" js/features/streamer-tournament-hidden-input-hotfix-v8.78.3.js
          grep -q "streamer-tournament-hidden-input-hotfix-v8.78.3.js?v=878300" js/features/route-feature-loader-v8.64.1.js
      - name: Verify deployed current tournament lookup
        env:
          LOOKUP_URL: https://cdmzrsvwztndqfwzsumo.supabase.co/functions/v1/limitless-refresh
          PUBLISHABLE_KEY: sb_publishable_rRpqFtZ_izENE8u8gTjo9Q_858RVJzl
          TOURNAMENT_ID: 6aa0471eab080c8c957fe27d
        run: |
          http_code=$(curl --silent --show-error --max-time 30 \
            --output /tmp/limitless-live.json \
            --write-out '%{http_code}' \
            -X POST "$LOOKUP_URL" \
            -H 'Content-Type: application/json' \
            -H "apikey: $PUBLISHABLE_KEY" \
            --data "{\"scope\":\"lookup\",\"tournamentId\":\"$TOURNAMENT_ID\"}")
          cat /tmp/limitless-live.json
          test "$http_code" = "200"
          python3 - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/limitless-live.json').read_text())
          assert body.get('ok') is True, body
          assert body.get('tournamentId') == '6aa0471eab080c8c957fe27d', body
          details=body.get('details') or {}
          name=str(details.get('name') or details.get('title') or '').strip()
          assert name, details
          assert 'Breakfast Club Daily #5' not in name, f'stale tournament identity returned: {name}'
          print('CURRENT_TOURNAMENT_LOOKUP_GREEN', {
              'name': name,
              'stage': details.get('stage'),
              'standings': len(body.get('standings') or []),
              'pairings': len(body.get('pairings') or []),
              'source': body.get('source'),
          })
          PY
