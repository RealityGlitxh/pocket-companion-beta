name: PocketNexus Streamer Tournament Auto Link QA

on:
  push:
    branches: [main]
    paths:
      - 'js/features/streamer-tournament-auto-link-v8.73.1.js'
      - 'js/features/route-feature-loader-v8.64.1.js'
      - 'js/services/limitless-live-table-service-v8.68.1.js'
      - 'js/features/streamer-limitless-live-table-v8.68.3.js'
      - 'js/app/streamer_tools-v8.64.1.js'
      - 'supabase/functions/limitless-refresh/index.ts'
      - 'qa/streamer-tournament-auto-link-qa.mjs'
      - '.github/workflows/streamer-tournament-auto-link-qa.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tournament-auto-link:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify automatic tournament overlay link
        run: node qa/streamer-tournament-auto-link-qa.mjs
      - name: Verify deployed live tournament lookup
        env:
          LOOKUP_URL: https://cdmzrsvwztndqfwzsumo.supabase.co/functions/v1/limitless-refresh
          PUBLISHABLE_KEY: sb_publishable_rRpqFtZ_izENE8u8gTjo9Q_858RVJzl
          TOURNAMENT_ID: 6aa22425a4272c53be64ca36
        run: |
          http_code=$(curl --silent --show-error --max-time 30 \
            --output /tmp/limitless-live.json \
            --write-out '%{http_code}' \
            -X POST "$LOOKUP_URL" \
            -H 'Content-Type: application/json' \
            -H "apikey: $PUBLISHABLE_KEY" \
            --data "{\"scope\":\"lookup\",\"tournamentId\":\"$TOURNAMENT_ID\"}")
          cat /tmp/limitless-live.json
          test "$http_code" = "200"
          python3 - <<'PY'
          import json
          from pathlib import Path
          body=json.loads(Path('/tmp/limitless-live.json').read_text())
          assert body.get('ok') is True, body
          assert body.get('tournamentId') == '6aa22425a4272c53be64ca36', body
          details=body.get('details') or {}
          standings=body.get('standings') or []
          pairings=body.get('pairings') or []
          assert 'Breakfast Club' in str(details.get('name','')), details
          assert len(standings) >= 30, f'expected live standings, got {len(standings)}'
          assert pairings, 'expected current round/bracket data'
          names={str(p.get('name','')) for p in standings}
          assert any('Reality' in n for n in names), 'known live player missing from parsed standings'
          assert details.get('stage') in {'Swiss','Top Cut','Top 8','Top 4','Finals'}, details
          print('DEPLOYED_LIVE_TOURNAMENT_LOOKUP_GREEN', {
              'name': details.get('name'),
              'stage': details.get('stage'),
              'standings': len(standings),
              'pairings': len(pairings),
              'source': body.get('source'),
          })
          PY
