name: Performance Pass 2D Streamer Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance-pass-2d-streamer-inspect.yml'

permissions:
  contents: read

jobs:
  inspect-streamer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect streamer globals and consumers
        run: |
          echo '=== DEFINITIONS / REFERENCES ==='
          grep -RInE "(initStreamerChannel|scheduleStreamerOverlayUpdate|publishStreamerOverlayState|buildStreamerOverlayState|STREAM_OVERLAY_STORE|streamerLastOverlaySeen|streamerTicker|streamerPage|syncStreamerCloud)" js index.html || true
          echo '=== streamer_rank_tools function/var declarations ==='
          grep -nE "^(function|async function|const|let|var) " js/app/streamer_rank_tools.js || true
          echo '=== file sizes ==='
          wc -c js/app/streamer_rank_tools.js js/app/rank_tools-v8.64.1.js js/app/account_startup.js js/features/battle-streamer-v8.43.js
