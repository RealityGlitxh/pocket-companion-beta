name: PocketNexus Pocket Coach Responsive QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pocket-coach-responsive-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 8123 >/tmp/pn-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Run Pocket Coach responsive and quick-prompt QA
        run: |
          cat > pocket-coach-responsive-qa.js <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const errors=[];
            for(const viewport of [{width:1440,height:900,name:'desktop'},{width:820,height:1180,name:'tablet'},{width:390,height:844,name:'mobile'}]){
              const page=await browser.newPage({viewport:{width:viewport.width,height:viewport.height}});
              page.on('pageerror',e=>errors.push(`${viewport.name}: ${String(e.message||e)}`));
              await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1000);
              const guest=page.getByRole('button',{name:/continue as guest/i});
              if(await guest.count())try{await guest.click({timeout:2000});await page.waitForTimeout(300)}catch{}
              await page.evaluate(()=>{
                document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop,#ppcWhatsNewBackdrop').forEach(x=>x.remove());
                window.goPage?.('coach');
              });
              await page.waitForTimeout(1800);
              const result=await page.evaluate(()=>{
                const root=document.querySelector('.coachPage');
                const prompts=[...document.querySelectorAll('.coachQuickPrompts button')];
                const input=document.getElementById('coachInput');
                const before=input?.value||'';
                prompts[0]?.click();
                const after=input?.value||'';
                return {
                  rendered:!!root,
                  promptCount:prompts.length,
                  promptFilled:after.length>0&&after!==before,
                  inputValue:after,
                  overflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth),
                  mainOverflow:root?Math.max(0,root.scrollWidth-root.clientWidth):999,
                  displayError:/We hit a display error/i.test(document.body.innerText),
                  quickPromptVisible:prompts[0]?prompts[0].getBoundingClientRect().width>0:false
                };
              });
              console.log(`POCKET_COACH_${viewport.name.toUpperCase()}_RESULT`,JSON.stringify(result));
              if(!result.rendered||result.promptCount<6||!result.promptFilled||!result.quickPromptVisible||result.overflow>2||result.mainOverflow>2||result.displayError)errors.push(`${viewport.name}: assertion failed ${JSON.stringify(result)}`);
              await page.close();
            }
            await browser.close();
            console.log('POCKET_COACH_QA_ERRORS',JSON.stringify(errors,null,2));
            if(errors.length)process.exit(1);
            console.log('POCKET_COACH_RESPONSIVE_QA_OK');
          })();
          NODE
          node pocket-coach-responsive-qa.js
