name: Pocket Coach Matchup Report Visual QA

on:
  push:
    branches: [main]
    paths:
      - 'js/app/ai_coach.js'
      - 'supabase/functions/pocket-coach/index.ts'
      - '.github/workflows/pocket-coach-matchup-report-ui-qa.yml'
  workflow_dispatch:

jobs:
  visual-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 8123 >/tmp/pn-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Render and verify Matchup Report
        run: |
          cat > coach-matchup-report-qa.cjs <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const errors=[];
            const mock=[{deckId:'d1',deckName:'Mega Lucario Test',archetypeName:'Mega Lucario ex / Lucario',archetypeMatchConfidence:'high',topThreats:[
              {opponentName:'Butterfree / Mega Sceptile ex',winRate:41.7,opponentUsagePct:14.2,matches:96,decided:91,evidence:'high',band:'unfavorable'},
              {opponentName:'Mega Altaria ex / Espeon',winRate:47.3,opponentUsagePct:9.8,matches:73,decided:70,evidence:'high',band:'slightly-unfavorable'},
              {opponentName:'Suicune ex / Baxcalibur',winRate:51.2,opponentUsagePct:7.1,matches:55,decided:53,evidence:'medium',band:'roughly-even'}
            ],recommendations:[
              {action:'consider-matchup-tech',cardName:'Test Tech',opponentArchetype:'Butterfree / Mega Sceptile ex',confidence:'medium-directional',evidence:{deltaWinRate:11.4}},
              {action:'review-for-matchup',cardName:'Test Review',opponentArchetype:'Mega Altaria ex / Espeon',confidence:'review-only',evidence:{deltaWinRate:-9.2}}
            ]}];
            for(const vp of [{name:'desktop',width:1440,height:900},{name:'tablet',width:820,height:1180},{name:'mobile',width:390,height:844}]){
              const page=await browser.newPage({viewport:{width:vp.width,height:vp.height}});
              page.on('pageerror',e=>errors.push(`${vp.name}: ${e.message}`));
              await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(900);
              await page.evaluate(()=>document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop,#ppcWhatsNewBackdrop').forEach(x=>x.remove()));
              const result=await page.evaluate((mock)=>{
                if(typeof window.coachMatchupReportHtml!=='function')return {renderer:false};
                const host=document.createElement('div');host.style.maxWidth='900px';host.style.margin='20px auto';host.innerHTML=window.coachMatchupReportHtml(mock);document.body.innerHTML='';document.body.appendChild(host);
                const root=document.querySelector('.coachMatchupReport');
                const text=root?.innerText||'';
                return {renderer:true,rendered:!!root,threats:document.querySelectorAll('.coachThreat').length,hasWr:text.includes('Matchup WR'),hasShare:text.includes('Meta share'),hasGames:text.includes('Games'),hasConfidence:text.includes('Confidence'),hasHelping:text.includes('Cards helping / test'),hasReview:text.includes('Cards to review'),overflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth),rootOverflow:root?Math.max(0,root.scrollWidth-root.clientWidth):999};
              },mock);
              console.log(`MATCHUP_REPORT_${vp.name.toUpperCase()}`,JSON.stringify(result));
              if(!result.renderer||!result.rendered||result.threats<3||!result.hasWr||!result.hasShare||!result.hasGames||!result.hasConfidence||!result.hasHelping||!result.hasReview||result.overflow>2||result.rootOverflow>2)errors.push(`${vp.name}: ${JSON.stringify(result)}`);
              await page.close();
            }
            await browser.close();
            console.log('MATCHUP_REPORT_UI_ERRORS',JSON.stringify(errors,null,2));
            if(errors.length)process.exit(1);
            console.log('POCKET_COACH_MATCHUP_REPORT_UI_QA_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node coach-matchup-report-qa.cjs
