name: PocketNexus AI Pairing Weakness Cover QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pairing-ai-weakness-cover-qa.yml"
      - "index.html"
      - "js/app/battle_gym.js"
      - "js/features/pairing-ai-weakness-cover-v8.71.1.js"

permissions:
  contents: read

jobs:
  pairing-ai-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start site
        run: |
          python3 -m http.server 8123 >/tmp/pn-pairing-ai-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Verify AI weakness-cover pairing logic and UI
        run: |
          cat > pairing-ai-qa.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const errors=[];page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>typeof window.pairingAIRecommend==='function'&&typeof window.pairingAIHtml==='function',{timeout:30000});
            const result=await page.evaluate(()=>{
              const mockDecks=[
                {id:'base',name:'Base Deck'},
                {id:'cover',name:'Cover Deck'},
                {id:'partial',name:'Partial Deck'}
              ];
              const profiles={
                base:{cells:[
                  {name:'Threat X',wr:30,n:10,usage:40,confidence:'High'},
                  {name:'Threat Y',wr:40,n:5,usage:30,confidence:'Medium'},
                  {name:'Good Matchup',wr:70,n:8,usage:20,confidence:'High'}
                ]},
                cover:{cells:[
                  {name:'Threat X',wr:65,n:8,usage:40,confidence:'High'},
                  {name:'Threat Y',wr:60,n:8,usage:30,confidence:'High'}
                ]},
                partial:{cells:[
                  {name:'Threat X',wr:45,n:8,usage:40,confidence:'High'},
                  {name:'Threat Y',wr:70,n:8,usage:30,confidence:'High'}
                ]}
              };
              window.gymSelectableDecks=()=>mockDecks;
              window.gymDeckProfile=d=>profiles[d.id]||{cells:[]};
              window.gymMatchupCellForTarget=(profile,target)=>profile.cells.find(c=>c.name===target)||{name:target,wr:0,n:0,usage:0,confidence:'Unknown'};
              window.gymPairAnalysis=(a,b)=>({score:50,a,b,mode:'antiMeta'});
              const rows=window.pairingAIRecommend('base');
              const html=window.pairingAIHtml(0);
              return {
                first:rows[0]?.partner?.id||'',
                score:rows[0]?.score||0,
                coverage:rows[0]?.coverage||0,
                covered:rows[0]?.covered?.length||0,
                shared:rows[0]?.shared?.length||0,
                partialCoverage:rows.find(r=>r.partner.id==='partial')?.coverage||0,
                hasHeading:/AI WEAKNESS COVER/.test(html),
                hasThreatX:/Threat X/.test(html),
                hasCoverDeck:/Cover Deck/.test(html),
                hasUsePair:/Use Pair/.test(html),
                hasExplain:/Explain with AI/.test(html),
                hasUnknownLanguage:/Unknown matchups stay unknown/.test(html)
              };
            });
            console.log('PAIRING_AI_RESULT',JSON.stringify(result));
            assert(result.first==='cover',`expected Cover Deck first, got ${result.first}`);
            assert(result.coverage===100,`expected 100% coverage, got ${result.coverage}`);
            assert(result.covered===2&&result.shared===0,`coverage classification wrong: ${JSON.stringify(result)}`);
            assert(result.partialCoverage>0&&result.partialCoverage<100,`partial partner should not receive full coverage: ${result.partialCoverage}`);
            assert(result.hasHeading&&result.hasThreatX&&result.hasCoverDeck&&result.hasUsePair&&result.hasExplain&&result.hasUnknownLanguage,`Pairing Lab AI UI incomplete: ${JSON.stringify(result)}`);
            assert(!errors.length,`runtime errors: ${errors.join(' | ')}`);
            await browser.close();
            console.log('PAIRING_AI_WEAKNESS_COVER_QA_OK');
          })().catch(e=>{console.error('PAIRING_AI_WEAKNESS_COVER_QA_FAILURE',e);process.exit(1)});
          NODE
          node pairing-ai-qa.cjs
