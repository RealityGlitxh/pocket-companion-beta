name: Apply Beta Green Fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-beta-green-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix imported deck card references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          decks = Path('js/app/decks_meta.js')
          text = decks.read_text()
          old = ''' // Use the same robust parser as Paste / Import.\n const analysis=analyzeImportedDeck(txt);\n'''
          new = ''' // Use the same robust parser as Paste / Import.\n const analysis=analyzeImportedDeck(txt);\n\n // Keep imported references anchored to the currently loaded canonical card map.\n // Name lookup helpers can outlive a background catalog refresh; reconcile every\n // resolved row before persisting so an imported deck never saves stale card IDs.\n const reconciledCards={};\n for(const row of analysis.resolved){\n   const live=cardMap.get(row.card?.id)\n     || CARDS.find(c=>String(c.id)===String(row.card?.id))\n     || CARDS.find(c=>normalizedCardName(c.name)===normalizedCardName(row.card?.name));\n   if(!live){analysis.unresolved.push(`Could not persist ${row.qty} ${row.name}. Reload/retry the Card Database.`);continue}\n   reconciledCards[live.id]=(reconciledCards[live.id]||0)+Number(row.qty||0);\n }\n analysis.cards=reconciledCards;\n'''
          if new in text:
              print('Deck import fix already present')
          elif old in text:
              decks.write_text(text.replace(old, new, 1))
          else:
              raise SystemExit('decks_meta import anchor not found')
          PY
      - name: Commit app fix
        run: |
          git config user.name 'PocketNexus QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/app/decks_meta.js
          if git diff --cached --quiet; then
            echo 'No app changes needed'
            exit 0
          fi
          git commit -m 'fix: reconcile imported deck card references'
          git push origin main
