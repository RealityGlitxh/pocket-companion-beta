name: PocketNexus Combined Competitive Meta QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/combined-meta-qa.yml"
      - "js/services/meta-service.js"
      - "js/services/tournament-service.js"
      - "js/app/decks_meta.js"
      - "index.html"

permissions:
  contents: read

jobs:
  combined-meta-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 8123 >/tmp/pn-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Run Combined Competitive Meta QA
        run: |
          cat > combined-meta-qa.js <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e.message||e)));
            const now=new Date().toISOString();
            await page.route('**/functions/v1/meta-live?window=*',async route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,status:'live',windowHours:168,snapshot:{generatedAt:now,tournaments:1,decklists:8,matches:20,validDecks:8,classifiedDecks:0,unclassifiedDecks:8,classificationRate:0,matchMappingRate:0},overview:{},archetypes:[],matchups:[]})}));
            await page.route('**/rest/v1/rpc/get_tournament_catalog',async route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify([{id:'qa-event-1',name:'QA Recent Pocket Event',start_date:now,player_count:4,tracked_players:4,format:'Pocket'}])}));
            await page.route('**/rest/v1/rpc/get_tournament_filter_options',async route=>route.fulfill({status:200,contentType:'application/json',body:'[]'}));
            await page.route('**/rest/v1/rpc/get_tournament_sync_status',async route=>route.fulfill({status:200,contentType:'application/json',body:'[]'}));
            await page.route('**/rest/v1/rpc/get_tournament_standings',async route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify([
              {placement:1,display_name:'Alpha',wins:5,losses:0,ties:0,archetype_name:'Mega Lucario ex / Greninja'},
              {placement:2,display_name:'Beta',wins:4,losses:1,ties:0,archetype_name:'Mega Lucario ex / Greninja'},
              {placement:3,display_name:'Gamma',wins:3,losses:2,ties:0,archetype_name:'Mega Venusaur ex'},
              {placement:4,display_name:'Delta',wins:2,losses:3,ties:0,archetype_name:'Mega Venusaur ex'}
            ])}));
            await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1200);
            const guest=page.getByRole('button',{name:/continue as guest/i});
            if(await guest.count())try{await guest.click({timeout:2500});await page.waitForTimeout(400)}catch{}
            await page.evaluate(async()=>{
              document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop,#ppcWhatsNewBackdrop').forEach(x=>x.remove());
              window.PPCMetaService?.clearCache?.();
              await window.PPCMetaService?.fetchWindow?.(168,{force:true});
              window.goPage?.('meta');
            });
            await page.waitForTimeout(4500);
            const result=await page.evaluate(()=>({
              source:window.PPCMetaService?.getStatus?.().source||'',
              archetypes:window.PPCMetaService?.getArchetypes?.().length||0,
              names:(window.PPCMetaService?.getArchetypes?.()||[]).map(x=>x.name),
              resultsText:[...document.querySelectorAll('.metaTopDecksPanel .badge')].map(x=>x.textContent.trim()).join(' '),
              runtimeError:document.querySelector('.runtimeError .dangerBox')?.innerText||'',
              displayError:/We hit a display error/i.test(document.body.innerText),
              overflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth)
            }));
            console.log('COMBINED_META_QA_RESULT',JSON.stringify({result,errors},null,2));
            await browser.close();
            if(result.archetypes<2||!result.names.some(x=>/Lucario/i.test(x))||!result.names.some(x=>/Venusaur/i.test(x))||result.runtimeError||result.displayError||result.overflow>2||errors.length)process.exit(1);
            console.log('COMBINED_META_QA_OK');
          })();
          NODE
          node combined-meta-qa.js
