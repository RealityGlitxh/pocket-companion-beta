name: PocketNexus Matches Rank Session Hotfix QA

on:
  push:
    branches: [main]
    paths:
      - "js/**"
      - "css/**"
      - "styles/**"
      - "index.html"
      - ".github/workflows/matches-rank-session-hotfix-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matches-rank-session-hotfix-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 8123 >/tmp/pn-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Open Matches before lazy Rank and verify runtime
        run: |
          cat > matches-rank-session-hotfix-qa.js <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1000);
            const guest=page.getByRole('button',{name:/continue as guest/i});
            if(await guest.count())try{await guest.click({timeout:2500});await page.waitForTimeout(500)}catch{}
            const before=await page.evaluate(()=>({rankPage:typeof window.rankBorderPage,sessionAccessor:typeof window.rankSessionService,service:!!window.PPCRankSessionService}));
            await page.evaluate(()=>window.goPage?.('matches'));
            await page.waitForTimeout(1000);
            const after=await page.evaluate(()=>({page:state?.page,sessionAccessor:typeof window.rankSessionService,serviceMatches:window.rankSessionService?.()===window.PPCRankSessionService,runtimeError:document.querySelector('.runtimeError .dangerBox')?.innerText||'',text:document.getElementById('app')?.innerText?.slice(0,500)||''}));
            console.log('MATCHES_RANK_SESSION_HOTFIX_RESULT',JSON.stringify({before,after,errors},null,2));
            await browser.close();
            if(before.sessionAccessor!=='function'||!before.service||after.page!=='matches'||after.sessionAccessor!=='function'||!after.serviceMatches||after.runtimeError||errors.some(x=>/rankSessionService is not defined/i.test(x)))process.exit(1);
            console.log('MATCHES_RANK_SESSION_HOTFIX_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node matches-rank-session-hotfix-qa.js
