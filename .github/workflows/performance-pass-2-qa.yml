name: Performance Pass 2 QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/performance-pass-2-qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax sweep
        run: |
          set -e
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate index script references
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.scripts=[]; self.links=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag=='script' and d.get('src'): self.scripts.append(d['src'])
                  if tag=='link' and d.get('href'): self.links.append(d['href'])

          root=Path('.')
          p=P(); p.feed(Path('index.html').read_text(encoding='utf-8'))
          missing=[]
          for ref in p.scripts+p.links:
              if ref.startswith(('http://','https://','//','data:')): continue
              path=ref.split('?',1)[0].split('#',1)[0]
              if path and not (root/path).exists(): missing.append(ref)
          if missing:
              raise SystemExit('Missing index assets: '+', '.join(missing))
          print(f'Validated {len(p.scripts)} scripts and {len(p.links)} linked assets.')
          PY

      - name: Validate lazy-route architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          loader=Path('js/features/route-feature-loader-v8.64.1.js').read_text(encoding='utf-8')
          bootstrap=Path('js/app/bootstrap.js').read_text(encoding='utf-8')
          startup=Path('js/app/account_startup.js').read_text(encoding='utf-8')

          lazy={
            'rank':'js/app/rank_tools-v8.64.1.js',
            'streamer':'js/app/streamer_tools-v8.64.1.js',
            'training':'js/app/training.js',
            'sync':'js/app/pocket_sync.js',
            'profile':'js/app/profile_teamwars.js',
            'teamwars':'js/app/profile_teamwars.js',
          }
          for route,path in lazy.items():
              if f'{route}:{{' not in loader:
                  raise SystemExit(f'Missing lazy route: {route}')
              if path not in loader:
                  raise SystemExit(f'{route} does not reference {path}')
              if not Path(path).exists():
                  raise SystemExit(f'Missing lazy bundle: {path}')

          forbidden=[
            'js/app/streamer_rank_tools.js',
            'js/app/rank_tools-v8.64.1.js',
            'js/app/streamer_tools-v8.64.1.js',
            'js/app/training.js',
            'js/app/pocket_sync.js',
            'js/app/profile_teamwars.js',
          ]
          for path in forbidden:
              if path in index:
                  raise SystemExit(f'Lazy bundle is still eager in index.html: {path}')

          if 'rank:window.rankBorderPage||dashboard' not in bootstrap:
              raise SystemExit('Bootstrap Rank fallback is missing')
          if 'streamer:window.streamerPage||dashboard' not in bootstrap:
              raise SystemExit('Bootstrap Streamer fallback is missing')
          if 'if(state.page==="rank")window.rankBorderPage?.()' not in startup:
              raise SystemExit('Rank auto-refresh lazy guard is missing')
          if Path('js/app/streamer_rank_tools.js').exists():
              raise SystemExit('Removed streamer_rank_tools.js monolith still exists')
          print('Lazy-route architecture validated.')
          PY

      - name: Validate required runtime globals
        run: |
          grep -q 'function publishStreamerOverlayState' js/core/streamer-runtime-core-v8.64.1.js
          grep -q 'function buildStreamerOverlayState' js/core/streamer-runtime-core-v8.64.1.js
          grep -q 'function streamerPage' js/app/streamer_tools-v8.64.1.js
          grep -q 'function syncStreamerCloud' js/app/streamer_tools-v8.64.1.js
          grep -q 'function rankBorderPage' js/app/rank_tools-v8.64.1.js
          grep -q 'function aboutPage' js/app/utility_pages-v8.64.1.js
          grep -q 'function morePage' js/app/utility_pages-v8.64.1.js
          grep -q 'PPCAccountCloudRuntime' js/core/account-cloud-runtime-v8.64.1.js

      - name: Local HTTP asset smoke test
        run: |
          python3 -m http.server 8123 >/tmp/ppc-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8123/index.html >/dev/null
          for f in \
            js/features/route-feature-loader-v8.64.1.js \
            js/app/rank_tools-v8.64.1.js \
            js/app/streamer_tools-v8.64.1.js \
            js/core/streamer-runtime-core-v8.64.1.js \
            js/core/account-cloud-core-v8.64.1.js \
            js/core/account-cloud-runtime-v8.64.1.js \
            js/app/utility_pages-v8.64.1.js \
            js/app/training.js \
            js/app/pocket_sync.js \
            js/app/profile_teamwars.js; do
              curl --fail --silent --show-error "http://127.0.0.1:8123/$f" >/dev/null
          done
          echo 'HTTP asset smoke test passed.'

      - name: Summary
        run: |
          echo 'Performance Pass 2 static QA passed.'
          echo 'Manual browser click-through is still required for runtime UI behavior.'
