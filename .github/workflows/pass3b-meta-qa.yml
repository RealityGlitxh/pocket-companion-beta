name: PocketNexus Pass 3B-4 Meta QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pass3b-meta-qa.yml"

permissions:
  contents: read

jobs:
  meta-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Static validation
        run: |
          grep -q 'pass3b-meta-v8.65.4.css?v=865401' index.html
          grep -q 'setMetaWindow' js/features/meta-cleanup-v8.64.1.js
          grep -q 'refreshMetaLive' js/features/meta-cleanup-v8.64.1.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 8123 >/tmp/pn-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Validate Meta interactions and layouts
        run: |
          cat > meta-qa.js <<'NODE'
          const {chromium}=require('playwright');
          const viewports=[['desktop',1440,900],['tablet',820,1180],['mobile',390,844]];
          const windows=[24,168,336,720];
          (async()=>{const browser=await chromium.launch({headless:true});let failures=0;
            for(const [name,width,height] of viewports){
              const context=await browser.newContext({viewport:{width,height},serviceWorkers:'block'});
              const page=await context.newPage();const errors=[];
              page.on('pageerror',e=>errors.push(String(e.message||e)));
              await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded',timeout:30000});await page.waitForTimeout(1200);
              const guest=page.getByRole('button',{name:/continue as guest/i});if(await guest.count())try{await guest.click({timeout:2500});await page.waitForTimeout(500)}catch{}
              await page.evaluate(()=>{try{window.onboardingSkip?.()}catch{};document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop').forEach(x=>x.remove());window.__qaFetches=0;const f=window.fetch;window.fetch=(...a)=>{window.__qaFetches++;return f(...a)}});
              await page.evaluate(()=>window.goPage?.('meta'));await page.waitForTimeout(500);
              const base=await page.evaluate(()=>({page:!!document.querySelector('.metaCompactPage'),title:document.querySelector('.metaCompactPage h1')?.textContent?.trim()||'',overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth,cards:document.querySelectorAll('.metaIntelCard').length}));
              if(!base.page||base.title!=='Competitive Meta'||base.overflow>8||errors.length){console.log('BASE_FAIL',name,base,errors);failures++}
              for(const w of windows){
                const before=await page.evaluate(()=>window.__qaFetches);
                await page.evaluate(w=>window.setMetaWindow?.(w),w);await page.waitForTimeout(180);
                const m=await page.evaluate(()=>({selected:Number(state.metaIntel?.windowHours||0),fetches:window.__qaFetches,overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth,errorScreen:/This page hit an error/i.test(document.body.innerText)}));
                if(m.selected!==w||m.fetches!==before||m.overflow>8||m.errorScreen){console.log('WINDOW_FAIL',name,w,m,{before});failures++}
              }
              await page.evaluate(()=>window.setMetaPrimaryView?.('matchups'));await page.waitForTimeout(250);
              const matchup=await page.evaluate(()=>({view:state.metaIntel?.primaryView,hasMatrix:/Matchup/i.test(document.querySelector('.metaCompactPage')?.innerText||''),overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth}));
              if(matchup.view!=='matchups'||!matchup.hasMatrix||matchup.overflow>8){console.log('MATCHUP_FAIL',name,matchup);failures++}
              await page.evaluate(()=>window.setMetaPrimaryView?.('tiers'));await page.waitForTimeout(200);
              const input=page.locator('.metaCompactSearch input');if(await input.count()){await input.fill('zzzz-no-match');await page.waitForTimeout(180);const noMatch=await page.locator('.metaCompactMain').innerText();if(!/No archetypes match/i.test(noMatch)){console.log('SEARCH_FAIL',name);failures++}await input.fill('');await page.waitForTimeout(180)}else{console.log('SEARCH_MISSING',name);failures++}
              const details=page.locator('.metaMoreData');if(await details.count()){await details.evaluate(el=>el.open=true);await page.waitForTimeout(120);const open=await details.evaluate(el=>el.open);if(!open){console.log('MORE_FAIL',name);failures++}}else{console.log('MORE_MISSING',name);failures++}
              const card=page.locator('.metaIntelCard').first();if(await card.count()){
                await card.click({timeout:2500}).catch(()=>{});await page.waitForTimeout(250);
                const detail=await page.evaluate(()=>({id:state.metaIntel?.detailId||null,error:/This page hit an error/i.test(document.body.innerText)}));
                if(detail.error){console.log('DETAIL_ERROR',name,detail);failures++}
                if(detail.id){await page.evaluate(()=>{state.metaIntel.detailId=null;render?.()});await page.waitForTimeout(150);if(!await page.locator('.metaCompactPage').count()){console.log('DETAIL_RETURN_FAIL',name);failures++}}
              }
              const refresh=page.getByRole('button',{name:'Refresh',exact:true});if(await refresh.count()){
                const before=await page.evaluate(()=>window.__qaFetches);await refresh.click();await page.waitForTimeout(450);
                const after=await page.evaluate(()=>({fetches:window.__qaFetches,errorScreen:/This page hit an error/i.test(document.body.innerText)}));
                if(after.errorScreen){console.log('REFRESH_CRASH',name,after);failures++}
                console.log('REFRESH',name,{before,after});
              }else{console.log('REFRESH_MISSING',name);failures++}
              const final=await page.evaluate(()=>({overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth,errors:document.querySelectorAll('.errorScreen').length}));
              if(final.overflow>8||errors.length){console.log('FINAL_FAIL',name,final,errors);failures++}
              console.log('PASS_VIEWPORT',name,{base,matchup,final,errors});await context.close();
            }
            await browser.close();if(failures){console.error('FAILURES',failures);process.exit(1)}console.log('META_QA_OK');
          })();
          NODE
          node meta-qa.js
