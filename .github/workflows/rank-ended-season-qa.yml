name: PocketNexus Ended Season Rank QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rank-ended-season-qa.yml"
      - "js/app/rank_tools-v8.64.1.js"
      - "js/features/route-feature-loader-v8.64.1.js"
      - "index.html"

permissions:
  contents: read

jobs:
  rank-ended-season-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 8123 >/tmp/pn-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Run ended-season Rank QA
        run: |
          cat > rank-ended-season-qa.js <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e.message||e)));
            await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1200);
            const guest=page.getByRole('button',{name:/continue as guest/i});
            if(await guest.count())try{await guest.click({timeout:2500});await page.waitForTimeout(400)}catch{}
            await page.evaluate(()=>window.goPage?.('rank'));
            await page.waitForTimeout(1800);
            const result=await page.evaluate(()=>{
              if(typeof rankBorderQuickSummary!=='function')return {missing:true};
              state.rank=state.rank||{}; state.rank.points=900;
              const html=rankBorderQuickSummary({targetRank:1000,predictedFinalRP:1975,recommendedSafeRP:2025,confidence:'medium'},{state:'ended',label:'Season ended',live:false});
              const host=document.createElement('div'); host.innerHTML=html;
              const text=(host.textContent||'').replace(/\s+/g,' ').trim();
              return {
                missing:false,
                text,
                hasFinalEstimate:/Final estimate/i.test(text),
                hasActionableGap:/RP to go|About\s+[\d,]+\s+RP to the estimated safety target|need about/i.test(text),
                runtimeError:document.querySelector('.runtimeError .dangerBox')?.innerText||''
              };
            });
            console.log('RANK_ENDED_SEASON_QA_RESULT',JSON.stringify({result,errors},null,2));
            await browser.close();
            if(result.missing||!result.hasFinalEstimate||result.hasActionableGap||result.runtimeError||errors.length)process.exit(1);
            console.log('RANK_ENDED_SEASON_QA_OK');
          })();
          NODE
          node rank-ended-season-qa.js
