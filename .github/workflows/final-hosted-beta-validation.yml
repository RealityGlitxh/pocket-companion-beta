name: PocketNexus Final Hosted Beta Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-hosted-beta-validation.yml"

permissions:
  contents: read

jobs:
  hosted-beta-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify deployed assets and hosted beta behavior
        env:
          BETA_URL: https://beta.pocketnexus.app/
        run: |
          cat > hosted-beta-qa.cjs <<'NODE'
          const {chromium,request}=require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const base=process.env.BETA_URL;
          const fatal=[];
          const clearOverlays=page=>page.evaluate(()=>document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop,#ppcWhatsNewBackdrop,.mobileMoreBackdrop').forEach(x=>x.remove()));
          const enterGuest=async page=>{
            const guest=page.locator('[data-entry-action="guest"]');
            if(await guest.count())await guest.click().catch(()=>{});
            await page.waitForFunction(()=>typeof save==='function'&&typeof goPage==='function',{timeout:60000});
            await page.evaluate(()=>{state.onboarding={...(state.onboarding||{}),completed:true,skipped:true};save();window.PPCWhatsNew?.close?.(true)});
            await clearOverlays(page);
          };
          (async()=>{
            const api=await request.newContext({extraHTTPHeaders:{'cache-control':'no-cache','pragma':'no-cache'}});
            const backupRes=await api.get(`${base}js/features/local-backup-restore-v8.70.0.js?launch=${Date.now()}`);
            assert(backupRes.ok(),`hosted backup asset HTTP ${backupRes.status()}`);
            const backupJs=await backupRes.text();
            assert(backupJs.includes('replaceLiveState'),'hosted beta is missing live-state backup restore repair');
            assert(backupJs.includes("pocketnexus-local-backup"),'hosted backup asset is not the expected feature');
            const loaderRes=await api.get(`${base}js/features/route-feature-loader-v8.64.1.js?launch=${Date.now()}`);
            assert(loaderRes.ok(),`hosted route loader HTTP ${loaderRes.status()}`);
            const loaderJs=await loaderRes.text();
            assert(loaderJs.includes('pocket-sync-simple-v8.70.0.js'),'hosted route loader is missing player-first Pocket Sync');
            const navRes=await api.get(`${base}js/core/navigation-v8.33.js?launch=${Date.now()}`);
            assert(navRes.ok(),`hosted navigation asset HTTP ${navRes.status()}`);
            const navJs=await navRes.text();
            assert(navJs.includes('v8.76.0 navigation/header final polish'),'hosted beta is missing navigation/header v8.76.0 behavior');
            const headerCssRes=await api.get(`${base}css/header-utility-menu-v8.64.2.css?launch=${Date.now()}`);
            assert(headerCssRes.ok(),`hosted header stylesheet HTTP ${headerCssRes.status()}`);
            const headerCss=await headerCssRes.text();
            assert(headerCss.includes('v8.76.0 final header polish'),'hosted beta is missing navigation/header v8.76.0 styles');
            await api.dispose();

            const browser=await chromium.launch({headless:true});

            const desktopContext=await browser.newContext({serviceWorkers:'block',viewport:{width:1440,height:1000}});
            const desktop=await desktopContext.newPage();
            desktop.on('pageerror',e=>fatal.push(`desktop pageerror: ${e.message}`));
            desktop.on('console',m=>{if(m.type()==='error'&&!/favicon|Failed to load resource|ERR_FAILED|net::ERR_/i.test(m.text()))fatal.push(`desktop console: ${m.text()}`)});
            await desktop.goto(`${base}?nav=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await enterGuest(desktop);
            await desktop.evaluate(()=>goPage('meta'));
            await desktop.waitForTimeout(800);
            await clearOverlays(desktop);
            const desktopNav=await desktop.evaluate(()=>{
              const header=document.querySelector('.appHeader');
              const search=document.getElementById('globalSearchButton');
              const logo=document.querySelector('.appBrandLogo');
              const active=document.querySelector('.navCategory.active>summary')?.textContent||document.querySelector('.navPrimaryBtn.active')?.textContent||'';
              return {
                version:header?.dataset.navVersion||'',
                logo:logo?.getAttribute('src')||'',
                searchVisible:!!search&&getComputedStyle(search).display!=='none',
                profiles:!!document.querySelector('.userChip'),
                settings:!!document.querySelector('.headerUtilityButton'),
                active:active.trim(),
                overflow:Math.max(0,Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth)
              };
            });
            assert(desktopNav.version==='8.76.0','hosted desktop header is not v8.76.0');
            assert(desktopNav.logo.includes('icons/icon-192.png'),'hosted desktop logo is not the local PocketNexus asset');
            assert(desktopNav.searchVisible,'hosted desktop Search is hidden');
            assert(desktopNav.profiles,'hosted desktop Profiles control missing');
            assert(desktopNav.settings,'hosted desktop Settings control missing');
            assert(/Compete|Meta/.test(desktopNav.active),'hosted desktop Meta active state missing');
            assert(desktopNav.overflow<=4,`hosted desktop header overflow ${desktopNav.overflow}px`);
            await desktop.locator('.navCategory[data-category="Play"] > summary').click();
            await desktop.waitForTimeout(50);
            await desktop.locator('.headerUtilityButton').click();
            await desktop.waitForTimeout(50);
            const popovers=await desktop.evaluate(()=>({open:[...document.querySelectorAll('.navCategory[open]')].map(x=>x.dataset.category||'utility'),groups:[...document.querySelectorAll('.headerUtilityGroupLabel')].map(x=>x.textContent.trim())}));
            assert(popovers.open.length===1&&popovers.open[0]==='Utilities','hosted desktop allows multiple major header popovers');
            assert(['ACCOUNT','TOOLS','APPLICATION','INFORMATION'].every(x=>popovers.groups.includes(x)),'hosted Settings grouping incomplete');
            await desktop.keyboard.press('Escape');
            assert(await desktop.locator('.navCategory[open]').count()===0,'Escape did not close hosted header menu');
            await desktop.keyboard.press('Control+K');
            await desktop.waitForTimeout(150);
            assert(await desktop.locator('#globalSearchInput').count()===1,'Ctrl+K did not open hosted Search');
            await desktop.keyboard.press('Escape');
            await desktopContext.close();

            const context=await browser.newContext({serviceWorkers:'block',viewport:{width:390,height:844}});
            const page=await context.newPage();
            page.on('pageerror',e=>fatal.push(`pageerror: ${e.message}`));
            page.on('console',m=>{if(m.type()==='error'&&!/favicon|Failed to load resource|ERR_FAILED|net::ERR_/i.test(m.text()))fatal.push(`console: ${m.text()}`)});
            await page.goto(`${base}?launch=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await enterGuest(page);
            const mobileHeader=await page.evaluate(()=>{const h=document.querySelector('.appHeader'),s=document.getElementById('globalSearchButton');return {height:h?.getBoundingClientRect().height||0,searchVisible:!!s&&getComputedStyle(s).display!=='none',mobileNav:!!document.getElementById('mobileNav')&&getComputedStyle(document.getElementById('mobileNav')).display!=='none',overflow:Math.max(0,Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth)}});
            assert(mobileHeader.height<=70,`hosted mobile header too tall ${mobileHeader.height}px`);
            assert(mobileHeader.searchVisible,'hosted mobile Search is hidden');
            assert(mobileHeader.mobileNav,'hosted mobile navigation is hidden');
            assert(mobileHeader.overflow<=4,`hosted mobile header overflow ${mobileHeader.overflow}px`);

            const routes=['dashboard','collection','decks','matches','stats','rank','meta','training','profile','sync','account','about'];
            const routeResults=[];
            for(const route of routes){
              await page.evaluate(r=>goPage(r),route);
              await page.waitForTimeout(route==='training'||route==='profile'||route==='sync'?1300:650);
              await clearOverlays(page);
              const result=await page.evaluate(r=>({route:r,text:(document.getElementById('app')?.innerText||'').trim(),overflow:Math.max(0,Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth)}),route);
              assert(result.text.length>20,`${route} rendered empty on hosted beta`);
              assert(!/Runtime Recovery|This page hit an error/i.test(result.text),`${route} hit runtime recovery on hosted beta`);
              assert(result.overflow<=12,`${route} mobile horizontal overflow ${result.overflow}px`);
              routeResults.push({route,overflow:result.overflow});
            }

            await page.evaluate(()=>goPage('sync'));
            await page.waitForFunction(()=>document.getElementById('app')?.innerText?.includes('Keep your PocketNexus data together'),{timeout:30000});
            await clearOverlays(page);
            const syncText=await page.locator('#app').innerText();
            assert(syncText.includes('Collection')&&syncText.includes('Battle History')&&syncText.includes('Rank History'),'player-first sync targets missing');
            assert(syncText.includes('Automatic game import')&&syncText.includes('COMING LATER'),'safe automatic-import status missing');
            assert(syncText.includes('Advanced / Developer Tools'),'advanced tools disclosure missing');
            assert(!syncText.includes('Staged JSON Adapter'),'developer adapter leaked into default Pocket Sync view');
            assert(!syncText.includes('Research Gate'),'old research-gate wording leaked into default Pocket Sync view');

            await page.evaluate(()=>goPage('account'));
            await page.waitForFunction(()=>!!window.PPCLocalBackupRestore&&!!document.getElementById('localBackupRestorePanel'),{timeout:30000});
            await clearOverlays(page);
            await page.evaluate(()=>{
              state.decks=[{id:'hosted-backup-deck',name:'HOSTED_BACKUP_RESTORE_DECK',cards:{},energy:''}];
              state.matches=[];state.collection={};state.rankHistory=[];save();
            });
            const snapshot=await page.evaluate(()=>window.PPCLocalBackupRestore.snapshot());
            assert(snapshot.data?.decks?.some(d=>d.name==='HOSTED_BACKUP_RESTORE_DECK'),'hosted backup snapshot does not read live state');
            const restorePayload={...snapshot,data:{...snapshot.data,decks:[{id:'hosted-restored-deck',name:'HOSTED_RESTORED_DECK',cards:{},energy:''}],matches:[],collection:{},rankHistory:[]}};
            await page.evaluate(()=>{state.decks=[];save()});
            await page.locator('#pocketNexusLocalRestoreInput').setInputFiles({name:'hosted-restore.json',mimeType:'application/json',buffer:Buffer.from(JSON.stringify(restorePayload))});
            await page.waitForFunction(()=>state.decks?.some(d=>d.name==='HOSTED_RESTORED_DECK'),{timeout:15000});
            await page.reload({waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>typeof save==='function',{timeout:60000});
            const persisted=await page.evaluate(()=>state.decks?.some(d=>d.name==='HOSTED_RESTORED_DECK'));
            assert(persisted,'hosted restored state did not survive reload');
            assert(fatal.length===0,`hosted runtime errors: ${fatal.join(' | ')}`);
            await browser.close();
            console.log('FINAL_HOSTED_BETA_VALIDATION_OK',JSON.stringify({routes:routeResults.length,navigation:'v8.76.0',desktopHeader:'green',mobileHeader:'green',sync:'player-first',backupRestore:'persisted'}));
          })().catch(e=>{console.error('FINAL_HOSTED_BETA_VALIDATION_FAILURE',e);process.exit(1)});
          NODE
          node hosted-beta-qa.cjs
