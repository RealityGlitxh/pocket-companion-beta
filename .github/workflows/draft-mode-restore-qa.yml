name: PocketNexus Draft Mode Restore QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/draft-mode-restore-qa.yml"
      - "qa/draft-mode-restore-qa.cjs"
      - "index.html"
      - "js/features/draft-mode-restore-v8.65.0.js"

permissions:
  contents: read

jobs:
  draft-mode-restore-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start site
        run: |
          python3 -m http.server 8123 >/tmp/pn-draft-qa.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Run Draft Mode restore QA
        run: node qa/draft-mode-restore-qa.cjs
