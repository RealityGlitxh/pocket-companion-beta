name: Rank Format Runtime Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rank-format-runtime-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove eager dashboard dependency on lazy Rank formatter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/features/experience-v8.36.js')
          s=p.read_text(encoding='utf-8')
          old='rankBorderFmt(rank.points)'
          if old not in s:
              raise SystemExit('Expected dashboard rank formatter reference not found')
          s=s.replace(old,"Number(rank.points||0).toLocaleString()")
          p.write_text(s,encoding='utf-8')
          PY
          node --check js/features/experience-v8.36.js
          echo 'Remaining non-Rank-bundle rankBorderFmt references:'
          grep -RIn "rankBorderFmt" js --include='*.js' | grep -v 'js/app/rank_tools-v8.64.1.js' || true
      - name: Commit repair
        run: |
          git config user.name 'PocketNexus Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add js/features/experience-v8.36.js
          git commit -m 'fix: remove dashboard dependency on lazy Rank formatter'
          git push
