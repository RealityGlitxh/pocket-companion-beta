name: Profile Symbol Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-symbol-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public identity backend contracts
        run: |
          echo '=== likely SQL/RPC contracts ==='
          grep -RInE "get_.*public_(profile|team)|public_(profile|team).*function|search_public_profiles|public_id" supabase sql migrations . --include='*.sql' --include='*.js' 2>/dev/null | head -160 || true
