name: Profile Symbol Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-symbol-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public profile symbol definitions
        run: |
          for sym in openPublicProfileByPublicId openPublicProfileById openPublicProfile openPublicTeam closePublicIdentity; do
            echo "=== $sym ==="
            grep -n "$sym" js/app/profile_teamwars.js || true
          done
          echo '=== public profile RPCs ==='
          grep -nE "rpc\('[^']*public[^']*'|rpc\(\"[^\"]*public[^\"]*\"" js/app/profile_teamwars.js || true
          echo '=== identity RPCs ==='
          grep -nE "rpc\('[^']*(profile|identity)[^']*'|rpc\(\"[^\"]*(profile|identity)[^\"]*\"" js/app/profile_teamwars.js || true
