name: PocketNexus Signed-In Regression QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "js/core/account-cloud-core-v8.64.1.js"
      - "js/core/account-cloud-runtime-v8.64.1.js"
      - "js/app/account_startup.js"
      - ".github/workflows/signed-in-regression-qa.yml"

permissions:
  contents: read

jobs:
  signed-in-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      POCKETNEXUS_QA_EMAIL: ${{ secrets.POCKETNEXUS_QA_EMAIL }}
      POCKETNEXUS_QA_PASSWORD: ${{ secrets.POCKETNEXUS_QA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify QA secrets are configured
        run: |
          if [ -z "$POCKETNEXUS_QA_EMAIL" ] || [ -z "$POCKETNEXUS_QA_PASSWORD" ]; then
            echo "::error::Signed-in QA requires repository secrets POCKETNEXUS_QA_EMAIL and POCKETNEXUS_QA_PASSWORD."
            exit 1
          fi
      - name: Create QA Supabase session
        run: |
          payload=$(jq -nc --arg email "$POCKETNEXUS_QA_EMAIL" --arg password "$POCKETNEXUS_QA_PASSWORD" '{email:$email,password:$password}')
          http_code=$(curl -sS -o /tmp/qa-auth.json -w "%{http_code}" \
            -X POST "https://cdmzrsvwztndqfwzsumo.supabase.co/auth/v1/token?grant_type=password" \
            -H "apikey: sb_publishable_rRpqFtZ_izENE8u8gTjo9Q_858RVJzl" \
            -H "Content-Type: application/json" \
            --data "$payload")
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            msg=$(jq -r '.msg // .error_description // .error // "Supabase authentication failed"' /tmp/qa-auth.json 2>/dev/null || echo "Supabase authentication failed")
            echo "::error::QA account authentication failed ($http_code): $msg"
            exit 1
          fi
          if ! jq -e '.access_token and .refresh_token and .user.id' /tmp/qa-auth.json >/dev/null; then
            echo "::error::Supabase did not return a complete QA session."
            exit 1
          fi
          session_b64=$(base64 -w0 /tmp/qa-auth.json)
          echo "::add-mask::$session_b64"
          echo "POCKETNEXUS_QA_SESSION_B64=$session_b64" >> "$GITHUB_ENV"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run authenticated route regression
        run: |
          cat > signed-in-regression.cjs <<'NODE'
          const { chromium } = require('playwright');
          const qaSession=JSON.parse(Buffer.from(process.env.POCKETNEXUS_QA_SESSION_B64,'base64').toString('utf8'));
          const fatal=[];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            page.on('pageerror',e=>fatal.push(`pageerror: ${e.message}`));
            page.on('console',m=>{if(m.type()==='error'&&!/favicon|Failed to load resource/i.test(m.text()))fatal.push(`console: ${m.text()}`)});
            await page.goto('https://beta.pocketnexus.app/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>typeof window.accountPage==='function'&&window.PPCAccountCloudCore?.hydrate,{timeout:30000});
            const seeded=await page.evaluate(async session=>{
              await window.PPCAccountCloudCore.hydrate(session,'SIGNED_IN_QA');
              return {uid:window.cloudSession?.user?.id||'',mode:window.state?.sessionMode||''};
            },qaSession);
            if(!seeded.uid||seeded.mode!=='cloud')throw new Error('verified Supabase session was not hydrated by PocketNexus');
            const routes=['dashboard','matches','rank','meta','decks','collection','profile','coach','streamer','dashboard'];
            for(const route of routes){
              const before=fatal.length;
              await page.evaluate(r=>headerNavigate(r),route);
              await page.waitForTimeout(1200);
              const stateNow=await page.evaluate(()=>({page:state.page,uid:cloudSession?.user?.id||'',recovery:document.body.innerText.includes('Runtime recovery')}));
              if(!stateNow.uid)throw new Error(`cloud session disappeared on ${route}`);
              if(stateNow.recovery)throw new Error(`runtime recovery appeared on ${route}`);
              if(fatal.length>before)throw new Error(`${route} emitted runtime errors: ${fatal.slice(before).join(' | ')}`);
              console.log('SIGNED_IN_ROUTE_OK',route,stateNow.page);
            }
            await browser.close();console.log('SIGNED_IN_REGRESSION_QA_OK');
          })().catch(e=>{console.error('SIGNED_IN_REGRESSION_QA_FAILURE',e);process.exit(1)});
          NODE
          node signed-in-regression.cjs
