name: PocketNexus Ranked Stream Control Center QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/streamer-ranked-refine-qa.yml"
      - "js/app/streamer_tools-v8.64.1.js"
      - "js/features/streamer-workspaces-v8.67.0.js"
      - "js/features/streamer-ranked-refine-v8.67.2.js"
      - "js/features/streamer-inline-overlay-guard-v8.67.7.js"
      - "js/features/streamer-obs-embed-style-v8.67.6.js"
      - "js/features/route-feature-loader-v8.64.1.js"
      - "css/streamer-ranked-refine-v8.67.2.css"
      - "css/streamer-obs-embed-v8.67.6.css"
      - "overlay.html"
      - "index.html"

permissions:
  contents: read

jobs:
  ranked-streamer-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 8123 >/tmp/pn-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Run Ranked Streamer QA
        run: |
          cat > ranked-qa.js <<'NODE'
          const {chromium}=require('playwright');
          const vps=[['desktop',1440,900],['tablet',820,1180],['mobile',390,844]];
          (async()=>{
            const browser=await chromium.launch({headless:true}); let failures=[];
            for(const [name,width,height] of vps){
              const ctx=await browser.newContext({viewport:{width,height},serviceWorkers:'block'});
              const page=await ctx.newPage(); const errors=[];
              page.on('pageerror',e=>errors.push(String(e.message||e)));
              const dismissOverlays=async()=>page.evaluate(()=>{
                document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop,#ppcWhatsNewBackdrop').forEach(x=>x.remove());
                document.querySelectorAll('[role="dialog"],.modalBackdrop,.modal-backdrop').forEach(x=>{if(/welcome\s*,?\s*guest/i.test(x.textContent||''))x.remove()});
              });

              await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1400);
              const guest=page.getByRole('button',{name:/continue as guest/i});
              if(await guest.count())try{await guest.click({timeout:2500});await page.waitForTimeout(500)}catch{}
              await dismissOverlays();
              await page.evaluate(()=>window.goPage?.('streamer'));
              await page.waitForTimeout(1800);
              await dismissOverlays();

              const state=await page.evaluate(()=>({
                refined:!!window.PPCStreamerRankedRefine,
                workspace:document.querySelector('#app')?.dataset.streamerWorkspace,
                grid:!!document.querySelector('.rankedControlGrid'),
                secondary:!!document.querySelector('.rankedSecondaryGrid'),
                hero:!!document.querySelector('.rankedStatusTray'),
                settingsVisible:!!document.querySelector('[data-streamer-section="overlay-settings"]') && !document.querySelector('[data-streamer-section="overlay-settings"]')?.hidden,
                diagCollapsed:!!document.querySelector('[data-streamer-section="diagnostics"] .rankedCollapsibleBody[hidden]'),
                inlinePreview:!!document.querySelector('#rankedRealObsPreview'),
                legacyPreviewHidden:!!document.querySelector('#streamPreview')?.hidden,
                quick:!!document.querySelector('[data-streamer-section="quick-match"]'),
                live:!!document.querySelector('[data-streamer-section="live-session"]'),
                rank:!!document.querySelector('[data-streamer-section="current-rank"]'),
                perf:!!document.querySelector('[data-streamer-section="session-performance"]'),
                overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth,
                error:/This page hit an error/i.test(document.body.innerText)
              }));
              if(!state.refined||state.workspace!=='ranked'||!state.grid||!state.secondary||!state.hero||!state.settingsVisible||!state.diagCollapsed||!state.inlinePreview||!state.legacyPreviewHidden||!state.quick||!state.live||!state.rank||!state.perf||state.overflow>8||state.error||errors.length)failures.push({name,state,errors});

              await dismissOverlays();
              const tournament=page.getByRole('tab',{name:/tournament workspace/i});
              if(await tournament.count()){
                try{
                  await tournament.click({timeout:5000});await page.waitForTimeout(700);await dismissOverlays();
                  const mode=await page.evaluate(()=>document.querySelector('#app')?.dataset.streamerWorkspace);
                  if(mode!=='tournament')failures.push({name,type:'tournament-switch',mode});
                }catch(e){failures.push({name,type:'tournament-click',error:String(e.message||e)})}
              }

              await dismissOverlays();
              const ranked=page.getByRole('tab',{name:/ranked workspace/i});
              if(await ranked.count()){
                try{
                  await ranked.click({timeout:5000});await page.waitForTimeout(900);await dismissOverlays();
                  const returned=await page.evaluate(()=>({
                    mode:document.querySelector('#app')?.dataset.streamerWorkspace,
                    control:document.querySelector('#app')?.classList.contains('rankedStreamControlCenter'),
                    preview:!!document.querySelector('#rankedRealObsPreview')
                  }));
                  if(returned.mode!=='ranked'||!returned.control||!returned.preview)failures.push({name,type:'ranked-return',returned});
                }catch(e){failures.push({name,type:'ranked-click',error:String(e.message||e)})}
              }
              await ctx.close();
            }
            await browser.close();
            console.log('RANKED_STREAMER_QA_RESULTS',JSON.stringify(failures,null,2));
            if(failures.length){console.error('RANKED_STREAMER_QA_FAILURES',failures.length);process.exit(1)}
            console.log('RANKED_STREAMER_QA_OK');
          })();
          NODE
          node ranked-qa.js
