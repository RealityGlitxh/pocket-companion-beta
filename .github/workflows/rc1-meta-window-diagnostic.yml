name: PocketNexus RC1 Meta Window Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rc1-meta-window-diagnostic.yml"

permissions:
  contents: read

jobs:
  meta-window-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Start isolated RC1 site
        run: |
          python3 -m http.server 8123 >/tmp/pn-meta-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8123/index.html >/dev/null && break; sleep 1; done
      - name: Diagnose Meta window selectors
        run: |
          cat > rc1-meta-window-diagnostic.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const sizes=[['desktop',1440,900],['mobile',390,844]];
          const wanted=[['24H',24],['7D',168],['14D',336],['30D',720]];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [label,width,height] of sizes){
              const context=await browser.newContext({viewport:{width,height},serviceWorkers:'block'});
              const page=await context.newPage();
              const fatal=[];
              page.on('pageerror',e=>fatal.push(`pageerror: ${e.message}`));
              page.on('console',m=>{if(m.type()==='error'&&!/favicon|Failed to load resource/i.test(m.text()))fatal.push(`console: ${m.text()}`)});
              await page.goto('http://127.0.0.1:8123/index.html',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(()=>typeof window.goPage==='function'&&typeof window.setMetaWindow==='function',{timeout:20000});
              const guest=page.getByRole('button',{name:/continue as guest/i});if(await guest.count())await guest.click({timeout:3000}).catch(()=>{});
              await page.evaluate(()=>{document.querySelectorAll('.ppcUpdateBackdrop,.onboardingBackdrop,#ppcWhatsNewBackdrop,.mobileMoreBackdrop').forEach(x=>x.remove());goPage('meta')});
              await page.waitForTimeout(1000);
              for(const [name,hours] of wanted){
                const before=await page.evaluate((name)=>{
                  const buttons=[...document.querySelectorAll('.metaWindowTabs button')];
                  const b=buttons.find(x=>x.textContent.trim()===name);
                  if(!b)return {exists:false,all:buttons.map(x=>x.textContent.trim())};
                  const r=b.getBoundingClientRect(),c=getComputedStyle(b),cx=Math.min(innerWidth-1,Math.max(0,r.left+r.width/2)),cy=Math.min(innerHeight-1,Math.max(0,r.top+r.height/2));
                  return {exists:true,connected:b.isConnected,disabled:b.disabled,display:c.display,visibility:c.visibility,opacity:c.opacity,pointerEvents:c.pointerEvents,rect:{x:r.x,y:r.y,w:r.width,h:r.height},center:[cx,cy],top:document.elementsFromPoint(cx,cy).slice(0,5).map(x=>({tag:x.tagName,cls:String(x.className||''),text:(x.textContent||'').trim().slice(0,40)})),windowHours:Number(state?.metaIntel?.windowHours||0),html:b.outerHTML};
                },name);
                console.log('META_WINDOW_BEFORE',label,name,JSON.stringify(before));
                assert(before.exists,`${label}/${name}: button missing`);
                let clickError='';
                try{await page.getByRole('button',{name,exact:true}).click({timeout:3000})}catch(e){clickError=String(e.message||e).slice(0,900)}
                const afterClick=await page.evaluate(()=>({windowHours:Number(state?.metaIntel?.windowHours||0),page:state?.page||'',buttons:[...document.querySelectorAll('.metaWindowTabs button')].map(x=>({text:x.textContent.trim(),active:x.classList.contains('active')}))}));
                console.log('META_WINDOW_AFTER_CLICK',label,name,JSON.stringify({clickError,afterClick}));
                if(afterClick.windowHours!==hours){
                  const js=await page.evaluate(({name,hours})=>{
                    const b=[...document.querySelectorAll('.metaWindowTabs button')].find(x=>x.textContent.trim()===name);if(!b)return {clicked:false,reason:'missing'};b.click();return {clicked:true,connected:b.isConnected,windowHours:Number(state?.metaIntel?.windowHours||0),expected:hours};
                  },{name,hours});
                  await page.waitForTimeout(250);
                  const afterJs=await page.evaluate(()=>({windowHours:Number(state?.metaIntel?.windowHours||0),page:state?.page||''}));
                  console.log('META_WINDOW_AFTER_JS_CLICK',label,name,JSON.stringify({js,afterJs}));
                  assert(afterJs.windowHours===hours,`${label}/${name}: handler failed; Playwright=${clickError}; JS=${JSON.stringify(js)}`);
                }
                await page.waitForTimeout(250);
              }
              assert(fatal.length===0,`${label}: runtime errors ${fatal.join(' | ')}`);
              await context.close();
            }
            await browser.close();console.log('RC1_META_WINDOW_DIAGNOSTIC_OK');
          })().catch(e=>{console.error('RC1_META_WINDOW_DIAGNOSTIC_FAILURE',e);process.exit(1)});
          NODE
          node rc1-meta-window-diagnostic.cjs
