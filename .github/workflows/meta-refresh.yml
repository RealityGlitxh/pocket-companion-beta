name: PocketNexus Meta Refresh

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/meta-refresh.yml"

concurrency:
  group: pocketnexus-meta-refresh
  cancel-in-progress: false

jobs:
  refresh-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Discover recent Pocket tournaments
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"scope":"recent","force":true,"maxPages":3}' \
            "https://cdmzrsvwztndqfwzsumo.supabase.co/functions/v1/limitless-refresh"

      - name: Import new tournament details, decklists, and matches
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"minPlayers":1,"limit":10,"force":true}' \
            "https://cdmzrsvwztndqfwzsumo.supabase.co/functions/v1/meta-import"

      - name: Build fresh 24H / 7D / 14D / 30D snapshots
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://cdmzrsvwztndqfwzsumo.supabase.co/functions/v1/meta-snapshot"
