name: PocketNexus Pass 3B Home Refinement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pass3b-home-refine.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine Home structure and styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('js/app/home.js')
          s=p.read_text()

          meta_new=r'''function dashboardMetaCommand(){
 const top=MetaService.getTopArchetypes().slice(0,4),snap=metaLiveSnapshot()?.snapshot;
 const status=window.PPCMetaService?.getStatus?.()||{source:"fallback",loading:false,error:""};
 const source=String(status.source||"fallback").toUpperCase();
 const live=source==="LIVE";
 const updated=snap?.generatedAt?`Updated ${new Date(snap.generatedAt).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}`:'Latest available snapshot';
 return `<section class="panel commandCard metaCommand homeIntelCard"><div class="commandCardHead"><div><span class="eyebrow">META SNAPSHOT</span><h2>Field pressure</h2></div><span class="statusDot ${live?'live':''}">${status.loading?'SYNCING':source}</span></div><div class="commandMetaList">${top.length?top.map((a,i)=>`<button onclick="state.page='meta';state.metaIntel.detailId='${a.id}';render()"><span class="metaRank">${i+1}</span><strong>${esc(a.shortName||a.name)}</strong><b>${metaPct(a.stats?.usage)}</b></button>`).join(''):`<div class="commandEmpty">Meta data is not loaded yet. Open Meta when you want to refresh it.</div>`}</div><div class="homeIntelFooter"><span>${esc(updated)}</span><button class="textButton" onclick="goPage('meta')">Open Meta →</button></div></section>`;
}
'''
          s,n=re.subn(r'function dashboardMetaCommand\(\)\{.*?\n\}\nfunction dashboard\(\)\{',meta_new+'function dashboard(){',s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'Could not replace dashboardMetaCommand block: {n}')

          dashboard_new=r'''function dashboard(){
 const st=stats(),rank=state.rank||{tier:"Unranked",points:0,streak:0},completed=completedMatches().sort((a,b)=>b.timestamp-a.timestamp),todayKey=new Date().toDateString();
 const today=completed.filter(m=>new Date(m.timestamp).toDateString()===todayKey),tw=today.filter(m=>m.result==="win").length,tl=today.filter(m=>m.result==="loss").length;
 const todayRp=today.reduce((n,m)=>n+(Number.isFinite(Number(m.rankChange))?Number(m.rankChange):0),0),todayWr=today.length?Math.round(tw/today.length*100):0;
 const recentDeck=state.decks.find(d=>d.id===completed[0]?.deckId)||state.decks.find(d=>d.id===state.selected)||state.decks[0]||null;
 const deckMatches=recentDeck?completed.filter(m=>m.deckId===recentDeck.id||String(m.deckName||'').trim().toLowerCase()===String(recentDeck.name||'').trim().toLowerCase()):[];
 const deckWins=deckMatches.filter(m=>m.result==='win').length,deckLosses=deckMatches.filter(m=>m.result==='loss').length;
 const deckRecord=deckMatches.length?`${deckWins}-${deckLosses}`:'No games yet';
 const todayTrend=todayRp===0?'0 RP':`${todayRp>0?'+':''}${todayRp} RP`;
 document.getElementById("app").innerHTML=`
 <section class="home3bHero">
   <div class="home3bHeroMain">
    <div class="pocketHeroKicker"><span class="pocketBallMark" aria-hidden="true"><i></i></span><span>YOUR COMPETITIVE POCKET</span></div>
    <h1>Ready for your next game?</h1>
    <p>Record the result first. PocketNexus keeps your deck, rank, matchup history, and coaching connected behind it.</p>
    <div class="home3bHeroActions"><button class="homePrimaryAction" onclick="goPage('matches')"><span>＋</span> Record Battle</button><button class="secondary" onclick="goPage('rank')">Open Rank</button></div>
   </div>
   <aside class="homeTodayCard" aria-label="Today's battle summary">
    <div class="homeTodayHead"><span class="eyebrow">TODAY</span><span class="homeTodayRp ${todayRp>0?'good':todayRp<0?'bad':''}">${todayTrend}</span></div>
    <div class="homeTodayRecord"><strong>${tw}-${tl}</strong><span>record</span></div>
    <div class="homeTodayStats"><div><b>${today.length}</b><span>Games</span></div><div><b>${today.length?todayWr+'%':'—'}</b><span>Win rate</span></div><div><b>${dashboardRankFmt(rank.points)}</b><span>Current RP</span></div></div>
   </aside>
 </section>

 <section class="homeContinueCard">
  <div class="homeContinueCopy"><span class="eyebrow">CONTINUE PLAYING</span><h2>${recentDeck?esc(recentDeck.name):'Build your first deck'}</h2><p>${recentDeck?`${deckCount(recentDeck)}/20 cards • ${analyze(recentDeck)}/100 structure • ${deckRecord} tracked record`:'A saved deck connects Battle, Performance, Collection, and competitive preparation.'}</p></div>
  <div class="homeContinueActions"><button onclick="goPage('${recentDeck?'matches':'decks'}')">${recentDeck?'Play This Deck':'Build Deck'}</button>${recentDeck?`<button class="secondary" onclick="openDeck('${recentDeck.id}')">Edit Deck</button>`:''}</div>
 </section>

 <section class="home3bDestinations" aria-label="PocketNexus workspaces">
  <article class="home3bDestination play"><div><span class="home3bIcon">◉</span><span class="eyebrow">PLAY</span></div><h2>Battle & Rank</h2><p>Log games and keep your climb current.</p><button class="homeDestinationLink" onclick="goPage('matches')">Battle workspace →</button></article>
  <article class="home3bDestination build"><div><span class="home3bIcon">▣</span><span class="eyebrow">BUILD</span></div><h2>Decks & Collection</h2><p>Build lists and know what you own.</p><button class="homeDestinationLink" onclick="goPage('decks')">Build workspace →</button></article>
  <article class="home3bDestination compete"><div><span class="home3bIcon">◆</span><span class="eyebrow">COMPETE</span></div><h2>Meta & Events</h2><p>Scout the field before you queue.</p><button class="homeDestinationLink" onclick="goPage('meta')">Competitive workspace →</button></article>
  <article class="home3bDestination improve"><div><span class="home3bIcon">⌁</span><span class="eyebrow">IMPROVE</span></div><h2>Performance</h2><p>Turn recorded games into next steps.</p><button class="homeDestinationLink" onclick="goPage('stats')">Performance workspace →</button></article>
 </section>

 <section class="homeSectionHeading"><div><span class="eyebrow">INTELLIGENCE</span><h2>What matters next</h2></div><button class="textButton" onclick="window.PPCWhatsNew?.open?.()">What's New</button></section>
 <div class="foundationIntelGrid home3bIntelGrid">${dashboardRankWidget()}${dashboardMetaCommand()}${dashboardCoachingWidget()}</div>

 <section class="panel foundationRecent home3bRecent"><div class="between"><div><span class="eyebrow">RECENT</span><h2>Last battles</h2><p class="muted tiny">Your newest tracked results, newest first.</p></div><button class="secondary" onclick="goPage('matches')">Open Battle Tracker</button></div>${homeRecentBattleRows(5)}</section>`;
}

function homeRecentBattleRows(n){
 const ms=completedMatches().sort((a,b)=>b.timestamp-a.timestamp).slice(0,n);
 if(!ms.length)return `<div class="homeRecentEmpty"><strong>No battles recorded yet.</strong><span>Record your first result to start building matchup and performance history.</span><button onclick="goPage('matches')">Record Battle</button></div>`;
 return `<div class="homeRecentList">${ms.map(m=>{const rc=m.result==="win"?"good":m.result==="loss"?"bad":"neutral",result=String(m.result||"—").toUpperCase(),ranked=m.gameMode==="ranked";return `<article class="homeRecentRow"><span class="homeResultBadge ${rc}">${result}</span><div class="homeRecentMatch"><strong>${esc(m.deckName||"Deck")} <span>vs ${esc(m.opponentArchetype||"Unknown")}</span></strong><small>${ranked?'Ranked':'Battle'}${m.turnOrder!=="unknown"?` • ${m.turnOrder==="first"?'Went first':'Went second'}`:''}${Number.isFinite(Number(m.rankChange))&&Number(m.rankChange)!==0?` • ${Number(m.rankChange)>0?'+':''}${Number(m.rankChange)} RP`:''}</small></div><time>${new Date(m.timestamp).toLocaleDateString([], {month:'short',day:'numeric'})}</time></article>`}).join('')}</div>`;
}
'''
          s,n=re.subn(r'function dashboard\(\)\{.*?\n\}\n\nfunction recentMatchesHtml',dashboard_new+'\nfunction recentMatchesHtml',s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'Could not replace dashboard block: {n}')
          p.write_text(s)

          css=Path('css/pass3b-home-v8.65.1.css')
          css.write_text(r'''/* PocketNexus v8.65.1 — Pass 3B-1 Home Refinement
   Home-only visual hierarchy. No feature/data ownership changes. */

#app:has(.home3bHero){max-width:1540px}
.home3bHero{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.62fr);gap:14px;align-items:stretch}
.home3bHeroMain,.homeTodayCard,.homeContinueCard,.home3bDestination{border:1px solid #243447;background:linear-gradient(145deg,rgba(18,31,46,.94),rgba(9,17,27,.96));box-shadow:0 16px 38px rgba(0,0,0,.18)}
.home3bHeroMain{border-radius:22px;padding:34px 36px;min-height:265px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.home3bHeroMain:after{content:"";position:absolute;right:-90px;top:-110px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(68,161,255,.12),transparent 68%);pointer-events:none}
.home3bHeroMain h1{max-width:760px;margin:10px 0 10px;font-size:clamp(2.7rem,4.25vw,4.55rem)}
.home3bHeroMain p{max-width:720px;margin:0;color:var(--muted);font-size:1rem;line-height:1.6}
.home3bHeroActions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}
.homePrimaryAction{min-height:50px;padding-inline:20px;font-weight:850;box-shadow:0 10px 24px rgba(46,142,255,.18)}
.homePrimaryAction span{font-size:1.12rem;margin-right:4px}
.homeTodayCard{border-radius:22px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.homeTodayHead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.homeTodayRp{font-size:.74rem;font-weight:850;padding:5px 8px;border-radius:999px;border:1px solid #31465b;background:#0c1722}
.homeTodayRecord{display:flex;align-items:baseline;gap:9px;margin:18px 0 14px}
.homeTodayRecord strong{font-size:clamp(3.3rem,5vw,5rem);letter-spacing:-.07em;line-height:.9}
.homeTodayRecord span{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;font-weight:800}
.homeTodayStats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.homeTodayStats div{padding:10px 8px;border-radius:11px;background:rgba(7,15,23,.68);border:1px solid #213246;min-width:0}
.homeTodayStats b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.homeTodayStats span{display:block;margin-top:3px;color:var(--muted);font-size:.67rem;text-transform:uppercase;letter-spacing:.05em}

.homeContinueCard{border-radius:18px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.homeContinueCopy{min-width:0}.homeContinueCopy h2{margin:3px 0 5px;font-size:1.35rem}.homeContinueCopy p{margin:0;color:var(--muted);font-size:.84rem;line-height:1.45}
.homeContinueActions{display:flex;gap:8px;flex:0 0 auto}

.home3bDestinations{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.home3bDestination{border-radius:15px;padding:16px;min-height:170px;display:flex;flex-direction:column;min-width:0;transition:transform .16s ease,border-color .16s ease}
.home3bDestination:hover{transform:translateY(-2px);border-color:#36587a}
.home3bDestination>div:first-child{display:flex;align-items:center;gap:8px}.home3bIcon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#111f2d;border:1px solid #2a4158;font-weight:900}
.home3bDestination h2{font-size:1.02rem;margin:12px 0 5px}.home3bDestination p{margin:0;color:var(--muted);font-size:.82rem;line-height:1.45}
.homeDestinationLink{margin-top:auto;min-height:34px;padding:7px 0 0;background:transparent;border:0;box-shadow:none;text-align:left;color:#9dccff;font-size:.79rem;font-weight:800}
.homeDestinationLink:hover{background:transparent;color:#d6ebff;transform:none}

.homeSectionHeading{display:flex;justify-content:space-between;align-items:end;gap:14px;padding:2px 3px 0}.homeSectionHeading h2{margin:3px 0 0;font-size:1.35rem}
.home3bIntelGrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:0}
.home3bIntelGrid>.commandCard{padding:15px 16px;border-radius:15px;min-height:250px;display:flex;flex-direction:column}
.home3bIntelGrid .commandCardHead{margin-bottom:9px}.home3bIntelGrid .commandCardHead h2{font-size:1rem;margin-top:2px}
.home3bIntelGrid .commandMetric strong{font-size:1.7rem}.home3bIntelGrid .commandStatRow{margin:7px 0}.home3bIntelGrid .commandLink{margin-top:auto;align-self:flex-start;min-height:34px;padding:7px 10px;font-size:.76rem}
.home3bIntelGrid .commandMetaList button{min-height:34px;padding:6px 7px}.home3bIntelGrid .commandMetaList strong,.home3bIntelGrid .commandMetaList b{font-size:.78rem}
.homeIntelFooter{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px;color:var(--muted);font-size:.7rem}.homeIntelFooter .textButton{min-height:30px;padding:4px 7px;white-space:nowrap}

.home3bRecent{padding:16px 18px}.home3bRecent>.between:first-child{align-items:flex-start}.home3bRecent h2{margin:3px 0 2px}
.homeRecentList{display:grid}.homeRecentRow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:11px;padding:10px 2px;border-top:1px solid #1f2c3a;min-width:0}.homeRecentRow:first-child{border-top:0}
.homeResultBadge{min-width:42px;padding:5px 7px;border-radius:8px;text-align:center;font-size:.7rem;font-weight:900;border:1px solid currentColor;background:rgba(255,255,255,.02)}
.homeRecentMatch{min-width:0}.homeRecentMatch strong{display:block;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.homeRecentMatch strong span{color:var(--muted);font-weight:650}.homeRecentMatch small{display:block;margin-top:3px;color:var(--muted);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.homeRecentRow time{font-size:.72rem;color:var(--muted);white-space:nowrap}
.homeRecentEmpty{display:grid;justify-items:start;gap:7px;padding:22px 2px 8px}.homeRecentEmpty span{color:var(--muted);font-size:.82rem}.homeRecentEmpty button{margin-top:4px}

@media(max-width:1120px){.home3bHero{grid-template-columns:minmax(0,1.35fr) minmax(280px,.75fr)}.home3bDestinations{grid-template-columns:repeat(2,minmax(0,1fr))}.home3bIntelGrid{grid-template-columns:1fr 1fr}.home3bIntelGrid>.commandCard:last-child{grid-column:1/-1;min-height:auto}}
@media(max-width:760px){.home3bHero{grid-template-columns:1fr}.home3bHeroMain{min-height:auto;padding:24px 20px}.home3bHeroMain h1{font-size:clamp(2.25rem,10vw,3.25rem)}.homeTodayCard{padding:18px}.homeTodayRecord{margin:14px 0}.homeTodayRecord strong{font-size:3.2rem}.homeContinueCard{align-items:stretch;flex-direction:column}.homeContinueActions{width:100%}.homeContinueActions button{flex:1}.home3bIntelGrid{grid-template-columns:1fr}.home3bIntelGrid>.commandCard:last-child{grid-column:auto}.home3bIntelGrid>.commandCard{min-height:auto}.home3bRecent>.between:first-child{align-items:stretch;flex-direction:column}.home3bRecent>.between:first-child>button{width:100%}}
@media(max-width:520px){.home3bHeroMain{border-radius:17px;padding:21px 16px}.homeTodayCard{border-radius:17px}.homeTodayStats{gap:5px}.homeTodayStats div{padding:9px 6px}.homeContinueCard{padding:15px}.homeContinueActions{flex-direction:column}.home3bDestinations{grid-template-columns:1fr}.home3bDestination{min-height:140px}.homeSectionHeading{align-items:flex-start}.home3bRecent{padding:14px}.homeRecentRow{grid-template-columns:auto minmax(0,1fr)}.homeRecentRow time{grid-column:2}.homeRecentMatch strong,.homeRecentMatch small{white-space:normal}}
@media(prefers-reduced-motion:reduce){.home3bDestination{transition:none}.home3bDestination:hover{transform:none}}
''')

          idx=Path('index.html')
          h=idx.read_text()
          if 'css/pass3b-home-v8.65.1.css' not in h:
              h=h.replace('<link rel="stylesheet" href="css/pass3a-utility-v8.65.0.css?v=865006">','<link rel="stylesheet" href="css/pass3a-utility-v8.65.0.css?v=865006">\n<link rel="stylesheet" href="css/pass3b-home-v8.65.1.css?v=865101">')
          h=h.replace('js/app/home.js?v=86418','js/app/home.js?v=865101')
          idx.write_text(h)
          PY

          node --check js/app/home.js
          grep -q 'home3bHero' js/app/home.js
          grep -q 'pass3b-home-v8.65.1.css?v=865101' index.html
          grep -q 'js/app/home.js?v=865101' index.html
          if grep -A4 'function dashboardMetaCommand' js/app/home.js | grep -q 'metaEnsureLive'; then echo 'Home Meta still refreshes during render'; exit 1; fi

      - name: Commit Home refinement
        run: |
          git config user.name "PocketNexus Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/app/home.js css/pass3b-home-v8.65.1.css index.html
          if git diff --cached --quiet; then
            echo "No Home refinement changes needed"
          else
            git commit -m "ui: refine Pass 3B Home experience"
            git push origin HEAD:main
          fi
