name: PocketNexus Profile Media Persistence QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "js/features/profile-media-upload-v8.64.2.js"
      - "js/app/profile_teamwars.js"
      - ".github/workflows/profile-media-persistence-qa.yml"

permissions:
  contents: read

jobs:
  profile-media-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POCKETNEXUS_QA_EMAIL: ${{ secrets.POCKETNEXUS_QA_EMAIL }}
      POCKETNEXUS_QA_PASSWORD: ${{ secrets.POCKETNEXUS_QA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify QA account
        run: |
          test -n "$POCKETNEXUS_QA_EMAIL" && test -n "$POCKETNEXUS_QA_PASSWORD" || { echo "::error::Missing QA account secrets"; exit 1; }
          payload=$(jq -nc --arg email "$POCKETNEXUS_QA_EMAIL" --arg password "$POCKETNEXUS_QA_PASSWORD" '{email:$email,password:$password}')
          code=$(curl -sS -o /tmp/qa-auth.json -w "%{http_code}" -X POST "https://cdmzrsvwztndqfwzsumo.supabase.co/auth/v1/token?grant_type=password" -H "apikey: sb_publishable_rRpqFtZ_izENE8u8gTjo9Q_858RVJzl" -H "Content-Type: application/json" --data "$payload")
          test "$code" -ge 200 -a "$code" -lt 300 || { echo "::error::QA authentication failed ($code)"; exit 1; }
          jq -e '.access_token and .refresh_token and .user.id' /tmp/qa-auth.json >/dev/null || { echo "::error::Incomplete QA session"; exit 1; }
          session_b64=$(base64 -w0 /tmp/qa-auth.json)
          echo "::add-mask::$session_b64"
          echo "POCKETNEXUS_QA_SESSION_B64=$session_b64" >> "$GITHUB_ENV"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify avatar and banner persistence
        run: |
          cat > profile-media-persistence.cjs <<'NODE'
          const { chromium } = require('playwright');
          const qaSession=JSON.parse(Buffer.from(process.env.POCKETNEXUS_QA_SESSION_B64,'base64').toString('utf8'));
          const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64');
          const fatal=[];
          const uploaded=[];
          let browser,page,backup=null;
          function fail(msg){throw new Error(msg)}
          (async()=>{
            browser=await chromium.launch({headless:true});
            page=await browser.newPage({viewport:{width:1440,height:1000}});
            page.on('pageerror',e=>fatal.push(`pageerror: ${e.message}`));
            page.on('console',m=>{if(m.type()==='error'&&!/favicon|Failed to load resource/i.test(m.text()))fatal.push(`console: ${m.text()}`)});
            await page.goto('https://beta.pocketnexus.app/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>window.PPCAccountCloudCore?.hydrate,{timeout:30000});
            await page.evaluate(session=>localStorage.setItem('sb-cdmzrsvwztndqfwzsumo-auth-token',JSON.stringify(session)),qaSession);
            await page.reload({waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>window.getPPCCloudSession?.()?.user?.id&&state?.sessionMode==='cloud',{timeout:30000});
            await page.evaluate(()=>headerNavigate('profile'));
            await page.waitForFunction(()=>document.getElementById('profileEditPanel')&&typeof window.PPCProfileMedia?.save==='function',{timeout:30000});
            await page.evaluate(()=>document.getElementById('profileEditPanel').showModal());
            await page.waitForSelector('#pfAvatarUpload');
            backup=await page.evaluate(()=>({
              uid:window.getPPCCloudSession().user.id,
              avatar:document.getElementById('pfAvatar')?.value||'',
              banner:document.getElementById('pfBanner')?.value||'',
              isPublic:!!document.getElementById('pfPublic')?.checked,
              display:document.getElementById('pfDisplay')?.value||'',
              username:document.getElementById('pfUser')?.value||'',
              bio:document.getElementById('pfBio')?.value||'',
              favorite:document.getElementById('pfFav')?.value||''
            }));
            await page.locator('#pfAvatarUpload').setInputFiles({name:'gate3-avatar.png',mimeType:'image/png',buffer:png});
            await page.locator('#pfBannerUpload').setInputFiles({name:'gate3-banner.png',mimeType:'image/png',buffer:png});
            const previews=await page.evaluate(()=>({
              avatar:!!document.querySelector('[data-profile-media-preview="avatar"] img'),
              banner:!!document.querySelector('[data-profile-media-preview="banner"] img')
            }));
            if(!previews.avatar||!previews.banner)fail('selected media did not render both previews');
            await page.evaluate(()=>{const p=document.getElementById('pfPublic');if(p)p.checked=true});
            const before=fatal.length;
            await page.evaluate(()=>window.PPCProfileMedia.save());
            await page.waitForFunction(()=>!document.getElementById('profileEditPanel')?.open,{timeout:30000});
            await page.waitForTimeout(1500);
            if(fatal.length>before)fail(`save emitted runtime errors: ${fatal.slice(before).join(' | ')}`);
            let stored=await page.evaluate(async()=>{
              const c=window.getPPCCloudClient(),uid=window.getPPCCloudSession().user.id;
              const {data,error}=await c.from('profiles').select('avatar_url,banner_url,display_name,username,bio,favorite_deck_name,privacy,public_id').eq('id',uid).single();
              if(error)throw error;return data;
            });
            if(!stored.avatar_url||!stored.banner_url)fail('profile row did not persist both media URLs');
            if(!stored.avatar_url.includes(`/storage/v1/object/public/profile-media/${backup.uid}/avatar-`))fail('avatar URL is not a public profile-media object owned by the QA user');
            if(!stored.banner_url.includes(`/storage/v1/object/public/profile-media/${backup.uid}/banner-`))fail('banner URL is not a public profile-media object owned by the QA user');
            uploaded.push(stored.avatar_url,stored.banner_url);
            await page.reload({waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>window.getPPCCloudSession?.()?.user?.id&&state?.sessionMode==='cloud',{timeout:30000});
            await page.evaluate(()=>headerNavigate('profile'));
            await page.waitForFunction(()=>document.getElementById('profileEditPanel'),{timeout:30000});
            await page.evaluate(()=>document.getElementById('profileEditPanel').showModal());
            const persisted=await page.evaluate(()=>({avatar:document.getElementById('pfAvatar')?.value||'',banner:document.getElementById('pfBanner')?.value||''}));
            if(persisted.avatar!==stored.avatar_url||persisted.banner!==stored.banner_url)fail('avatar/banner URLs did not survive full reload');
            await page.evaluate(()=>document.getElementById('profileEditPanel')?.close());
            await page.evaluate(()=>headerNavigate('dashboard'));
            await page.waitForTimeout(500);
            await page.evaluate(()=>headerNavigate('profile'));
            await page.waitForTimeout(1200);
            const reroute=await page.evaluate(()=>document.body.innerHTML.includes(stored.avatar_url)&&document.body.innerHTML.includes(stored.banner_url));
            if(!reroute)fail('profile media did not render after navigating away and back');
            if(!stored.public_id)fail('QA profile has no public_id for public-profile verification');
            await page.evaluate(id=>openPublicProfileByPublicId(id),stored.public_id);
            await page.waitForTimeout(1500);
            const publicState=await page.evaluate(()=>({avatar:teamWarsState?.publicProfile?.avatar_url||'',banner:teamWarsState?.publicProfile?.banner_url||''}));
            if(publicState.avatar!==stored.avatar_url||publicState.banner!==stored.banner_url)fail('public profile did not expose the saved avatar and banner');
            console.log('PROFILE_MEDIA_PERSISTENCE_QA_OK');
          })().catch(e=>{console.error('PROFILE_MEDIA_PERSISTENCE_QA_FAILURE',e);process.exitCode=1}).finally(async()=>{
            try{
              if(page&&backup){
                await page.evaluate(()=>headerNavigate('profile')).catch(()=>{});
                await page.waitForTimeout(800).catch(()=>{});
                await page.evaluate(b=>{
                  const d=document.getElementById('profileEditPanel');if(d&&!d.open)d.showModal();
                  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.value=v||''};
                  set('pfAvatar',b.avatar);set('pfBanner',b.banner);set('pfDisplay',b.display);set('pfUser',b.username);set('pfBio',b.bio);set('pfFav',b.favorite);
                  const pub=document.getElementById('pfPublic');if(pub)pub.checked=b.isPublic;
                },backup).catch(()=>{});
                await page.evaluate(()=>window.__profileMediaOriginalSave?.()).catch(()=>{});
                if(uploaded.length){await page.evaluate(async urls=>{
                  const c=window.getPPCCloudClient();
                  const paths=urls.map(u=>decodeURIComponent(u.split('/storage/v1/object/public/profile-media/')[1]||'')).filter(Boolean);
                  if(paths.length)await c.storage.from('profile-media').remove(paths);
                },uploaded).catch(()=>{});}
              }
            }finally{if(browser)await browser.close().catch(()=>{})}
          });
          NODE
          node profile-media-persistence.cjs
