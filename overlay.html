<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Companion — Streamer Overlay 3.0</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,Segoe UI,Arial,sans-serif}*{box-sizing:border-box}#root{width:100%;height:100%;display:grid;place-items:end center;padding:24px}.card{width:min(920px,96vw);color:#fff;background:rgba(8,12,20,.88);border:1px solid #ffffff24;border-radius:22px;padding:22px;box-shadow:0 18px 60px #0008;animation:in .35s ease}.ey{font-size:12px;letter-spacing:.14em;opacity:.65}.big{font-size:32px;font-weight:900}.row{display:flex;gap:14px;align-items:center;justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.stat{padding:12px;border:1px solid #ffffff18;border-radius:14px;background:#ffffff0b}.stat strong{display:block;font-size:25px}.good{color:#6fe7a9}.bad{color:#ff8e98}.deckgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}.deckgrid div{padding:8px;border-radius:9px;background:#ffffff0d;font-size:12px}.qr{width:180px;height:180px;background:#fff;border-radius:14px;display:grid;place-items:center;color:#111;text-align:center;padding:15px;font-weight:800}.graph{width:100%;height:150px}.graph polyline{fill:none;stroke:currentColor;stroke-width:4}.hud{position:fixed;right:22px;top:22px;color:#fff;background:#080c14dd;border:1px solid #ffffff22;border-radius:999px;padding:9px 15px;font-weight:800}.light .card,.light .hud{color:#111;background:#fffffff0}.transparent .card{background:#080c1470}.muted{opacity:.7}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:650px){.stats{grid-template-columns:1fr}.deckgrid{grid-template-columns:repeat(4,1fr)}.big{font-size:24px}}
.deckhero{display:flex;gap:10px;margin-top:14px;align-items:flex-end}.deckhero img{width:110px;max-height:154px;object-fit:contain;border-radius:10px}.qr canvas,.qr img{width:160px!important;height:160px!important}.qr small{display:block;padding:8px}.tie{color:#ffd36f}</style></head><body><div id="root"></div><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>
const STORE="ppc_stream_overlay_v83",CHANNEL="ppc-stream-v83";let d=null,ch=null,scene=0,lastSwitch=Date.now();const esc=s=>String(s??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));function load(){try{return JSON.parse(localStorage.getItem(STORE)||"null")}catch(e){return null}}function enabled(){let s=d?.config?.scenes||{},mode=d?.config?.overlayMode||"ranked",a=Object.keys(s).filter(k=>s[k]!==false);if(mode==="tournament"||mode==="caster")a=a.filter(k=>k!=="rank"&&k!=="graph");return a.length?a:[mode==="ranked"?"rank":"tournament"]}function graph(){let p=d.rpJourney||[d.rank.points],mi=Math.min(...p),ma=Math.max(...p),dlt=Math.max(1,ma-mi),pts=p.map((v,i)=>`${i*(100/Math.max(1,p.length-1))},${90-(v-mi)/dlt*75}`).join(" ");return `<div class=card><span class=ey>LIVE RP JOURNEY</span><div class=row><span class=big>${d.rank.points} RP</span><span>${esc(d.rank.tier)}</span></div><svg class=graph viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${pts}"/></svg><span class=muted>Session low ${mi} • high ${ma}</span></div>`}function sceneHtml(k){let c=d.config||{},s=d.session,l=d.lastMatch,t=d.tournament||{},ca=d.caster||{};if(k==="graph")return graph();if(k==="deck")return `<div class=card><span class=ey>CURRENT DECK</span><div class=big>${esc(d.deck.name)}</div><p>${esc(d.deck.archetype||d.deck.energy||"Pokémon TCG Pocket")}</p>${(d.deck.cards||[]).filter(x=>x.image).slice(0,3).length?`<div class=deckhero>${(d.deck.cards||[]).filter(x=>x.image).slice(0,3).map(x=>`<img src="${esc(x.image)}" alt="${esc(x.name)}">`).join("")}</div>`:""}<div class=stats><div class=stat><span>SESSION</span><strong>${s?`${s.wins}-${s.losses}-${s.ties||0}`:"—"}</strong></div><div class=stat><span>STREAK</span><strong>${esc(d.record.streak)}</strong></div><div class=stat><span>WIN RATE</span><strong>${Number(d.record.winRate||0).toFixed(1)}%</strong></div></div></div>`;if(k==="decklist")return `<div class=card><span class=ey>20-CARD DECK LIST</span><div class=big>${esc(d.deck.name)}</div><div class=deckgrid>${(d.deck.cards||[]).map(x=>`<div><b>${esc(x.name)}</b><br>×${Number(x.qty||1)}</div>`).join("")||"<div class=muted>No saved card list</div>"}</div></div>`;if(k==="qr")return `<div class=card><div class=row><div><span class=ey>DECK QR</span><div class=big>${esc(d.deck.name)}</div><p class=muted>${d.deck.shareUrl?"Scan to open the shared deck.":"Create a private deck share link in Stream Control Center first."}</p></div><div class=qr id=deckQr>${d.deck.shareUrl?"":"QR<br>WAITING"}</div></div></div>`;if(k==="lastmatch")return `<div class=card><span class=ey>LAST MATCH</span>${l?`<div class="big ${l.result==="win"?"good":l.result==="tie"?"tie":"bad"}">${l.result.toUpperCase()}</div><h2>${esc(l.deckName)} vs ${esc(l.opponentArchetype)}</h2><p>${l.rankChange>0?"+":""}${l.rankChange} RP • ${l.rankAfter} RP total</p>`:"<p>No match recorded yet.</p>"}</div>`;if(k==="matchup")return `<div class=card><span class=ey>MATCHUP</span><div class=big>${esc(d.deck.name)} vs ${esc(d.opponent||"Opponent")}</div><p>Lifetime ${d.matchup?.lifetime?.w||0}-${d.matchup?.lifetime?.l||0}-${d.matchup?.lifetime?.t||0} • Session ${d.matchup?.session?.w||0}-${d.matchup?.session?.l||0}-${d.matchup?.session?.t||0}</p></div>`;if(k==="tournament"){if(c.overlayMode==="caster")return `<div class=card><span class=ey>CASTER MODE • ${esc(t.name)}</span><div class=row><div class=big>${esc(ca.a)}</div><div class=big>${ca.scoreA} — ${ca.scoreB}</div><div class=big>${esc(ca.b)}</div></div><p class=muted>${esc(t.round)} • ${esc(t.stage)}</p></div>`;return `<div class=card><span class=ey>TOURNAMENT MODE</span><div class=big>${esc(t.name)}</div><div class=stats><div class=stat><span>ROUND</span><strong>${esc(t.round)}</strong></div><div class=stat><span>RECORD</span><strong>${esc(t.record)}</strong></div><div class=stat><span>STAGE</span><strong>${esc(t.stage)}</strong></div></div></div>`}return `<div class=card><span class=ey>LIVE RANK</span><div class=row><div><div class=big>${esc(d.rank.tier)}</div><b>${d.rank.points} RP</b></div><div class=stats><div class=stat><span>RECORD</span><strong>${d.record.wins}-${d.record.losses}-${d.record.ties||0}</strong></div><div class=stat><span>STREAK</span><strong>${esc(d.record.streak)}</strong></div><div class=stat><span>SESSION RP</span><strong>${s?(s.rankChange>0?"+":"")+s.rankChange:"—"}</strong></div></div></div></div>`}function render(){d=d||load();if(!d){root.innerHTML="";return}document.body.className=d.config?.theme||"dark";let a=enabled();scene=Math.min(scene,a.length-1);root.style.opacity=String(Math.max(.1,Math.min(1,Number(d.config?.opacity||85)/100)));root.style.fontSize=`${Math.max(70,Math.min(150,Number(d.config?.fontScale||100)))}%`;root.innerHTML=`${d.config?.persistentHud!==false&&d.config?.overlayMode==="ranked"?`<div class=hud>${esc(d.rank.tier)} • ${d.rank.points} RP • ${d.record.streak}</div>`:""}${sceneHtml(a[scene])}`;if(a[scene]==="qr"&&d.deck?.shareUrl){const el=document.getElementById("deckQr");if(el&&typeof QRCode==="function"){el.innerHTML="";new QRCode(el,{text:d.deck.shareUrl,width:160,height:160,correctLevel:QRCode.CorrectLevel.M})}else if(el){el.innerHTML="<small>QR library unavailable</small>"}}}function step(){if(!d)return;let a=enabled();scene=(scene+1)%a.length;lastSwitch=Date.now();render()}try{if(typeof BroadcastChannel==="function"){ch=new BroadcastChannel(CHANNEL);ch.onmessage=e=>{let m=e.data||{};if(m.type==="state"&&m.data){d=m.data;scene=Number(d.config?.sceneIndex||scene)%enabled().length;render()}else if(m.type==="ping")ch.postMessage({type:"pong",from:"overlay",at:Date.now()})};ch.postMessage({type:"overlay-ready",at:Date.now()})}}catch(e){}window.addEventListener("storage",e=>{if(e.key===STORE){d=load();render()}});d=load();render();setInterval(()=>{if(d?.config?.sceneRotation!==false&&Date.now()-lastSwitch>=Number(d.config?.sceneSeconds||10)*1000)step();if(ch)try{ch.postMessage({type:"overlay-heartbeat",at:Date.now()})}catch(e){}},1000);
</script></body></html>
